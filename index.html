trong>VLSM<\/strong> использует разные длины префикса для подсетей одного адресного пространства. Это экономит адреса: WAN-соединению с двумя интерфейсами не нужна подсеть на 30 хостов. В учебном примере /30 предоставляет 2 адреса хостов. Для потребности в 28 узлах подходит /27, в которой доступны 30 адресов хостов.<\/p><p>Алгоритм: отсортируй требования от большего к меньшему, подбери маску для каждой сети, выделяй выровненные непересекающиеся блоки и фиксируй network, host range, broadcast. Не считай сетевой и broadcast-адрес адресами устройств. Для серверов и шлюзов планируй предсказуемые адреса; пользовательские ПК часто используют DHCP. Источник: с. 55–61.<\/p>", "en": "<p><strong>VLSM<\/strong> uses different prefix lengths for subnets of one address space. This conserves addresses: a WAN link with two interfaces does not need a 30-host subnet. In the lecture’s ordinary examples, /30 provides two usable host addresses. A /27 meets a requirement for 28 hosts because it provides 30 usable host addresses.<\/p><p>Procedure: sort requirements from largest to smallest, choose each subnet’s mask, allocate aligned non-overlapping blocks, and record network, host range and broadcast. Do not assign the network or broadcast address to devices. Plan predictable addresses for servers and gateways; user PCs commonly use DHCP. Source: pp. 55–61.<\/p>"}}], "traps": [{"ru": "/26 даёт 64 адреса, но 62 обычных usable hosts.", "en": "/26 gives 64 addresses but 62 ordinary usable hosts."}, {"ru": "172.31.x.x — частный; 172.32.x.x уже не входит в частный /12.", "en": "172.31.x.x is private; 172.32.x.x lies outside the private /12."}, {"ru": "Число подсетей считают относительно исходного префикса, а не просто по новому префиксу.", "en": "Count subnets relative to the original prefix, not from the new prefix alone."}, {"ru": "При VLSM выделяй самые большие блоки первыми и проверяй пересечения.", "en": "In VLSM, allocate the largest blocks first and check for overlap."}]}, {"id": "l7", "lecture": 7, "title": {"ru": "IPv6 и диагностика ICMP", "en": "IPv6 addressing and ICMP diagnostics"}, "summary": {"ru": "Сокращай IPv6 без ошибок, различай GUA и LLA, понимай SLAAC и DHCPv6 и выбирай правильную команду диагностики.", "en": "Compress IPv6 correctly, distinguish GUA from LLA, understand SLAAC and DHCPv6, and choose the right diagnostic tool."}, "sourcePages": "1–67", "sections": [{"heading": {"ru": "1. Формат и сокращение IPv6", "en": "1. IPv6 format and compression"}, "html": {"ru": "<p>IPv6 использует <strong>128 бит<\/strong>: восемь групп по 16 бит, записанных шестнадцатеричными цифрами. Такая группа называется <strong>hextet<\/strong>. Регистр букв значения не имеет. Внутри группы можно удалить ведущие нули: <code>0db8 → db8<\/code>, <code>0200 → 200<\/code>. Конечные нули удалять нельзя: <code>1200<\/code> не равно <code>12<\/code>.<\/p><p>Одну непрерывную последовательность нулевых групп можно заменить на <code>::<\/code>. Этот знак допускается только один раз, иначе восстановить количество пропущенных групп однозначно нельзя. Пример: <code>2001:0db8:0000:1111:0000:0000:0000:0200<\/code> превращается в <code>2001:db8:0:1111::200<\/code>. При обратном раскрытии дополни адрес до восьми групп. <code>/64<\/code> означает 64 бита сетевого префикса, а не 64 узла.<\/p>", "en": "<p>IPv6 uses <strong>128 bits<\/strong>: eight groups of 16 bits written in hexadecimal. Each group is a <strong>hextet<\/strong>, and letters are case-insensitive. Leading zeros within a group can be removed: <code>0db8 → db8<\/code>, <code>0200 → 200<\/code>. Trailing zeros cannot be removed: <code>1200<\/code> is not equal to <code>12<\/code>.<\/p><p>One contiguous run of zero groups can be replaced by <code>::<\/code>. Use this only once, otherwise expansion becomes ambiguous. For example, <code>2001:0db8:0000:1111:0000:0000:0000:0200<\/code> becomes <code>2001:db8:0:1111::200<\/code>. To expand an address, restore eight groups. The prefix <code>/64<\/code> means 64 network-prefix bits, not 64 hosts.<\/p>"}}, {"heading": {"ru": "2. Типы адресов и область действия", "en": "2. Address types and scope"}, "html": {"ru": "<ul><li><strong>Unicast:<\/strong> одному интерфейсу.<\/li><li><strong>Multicast:<\/strong> группе получателей.<\/li><li><strong>Anycast:<\/strong> ближайшему по маршрутизации участнику группы с одинаковым адресом.<\/li><\/ul><p>В IPv6 <strong>нет broadcast<\/strong>. GUA — глобально маршрутизируемый адрес; в лекции рассматривается диапазон <code>2000::/3<\/code>. LLA использует <code>fe80::/10<\/code>, действует только на локальном канале и не пересылается маршрутизатором между сетями. Интерфейс обычно имеет LLA и может иметь GUA. ULA <code>fc00::/7<\/code> предназначен для локального использования, а не глобальной маршрутизации. Loopback — <code>::1<\/code>. Для типичной LAN используется <code>/64<\/code>: 64 бита префикса и 64 бита идентификатора интерфейса.<\/p>", "en": "<ul><li><strong>Unicast:<\/strong> one interface.<\/li><li><strong>Multicast:<\/strong> a group of receivers.<\/li><li><strong>Anycast:<\/strong> the routing-nearest member sharing the address.<\/li><\/ul><p>IPv6 has <strong>no broadcast<\/strong>. A GUA is globally routable; the lecture discusses <code>2000::/3<\/code>. An LLA uses <code>fe80::/10<\/code>, stays on the local link, and is not forwarded between networks by a router. An interface normally has an LLA and may also have a GUA. ULA <code>fc00::/7<\/code> is intended for local use rather than global routing. Loopback is <code>::1<\/code>. A typical LAN uses <code>/64<\/code>: 64 prefix bits and 64 interface-identifier bits.<\/p>"}}, {"heading": {"ru": "3. SLAAC, RA и DHCPv6", "en": "3. SLAAC, RA and DHCPv6"}, "html": {"ru": "<p>Хост отправляет <strong>RS<\/strong>, чтобы запросить информацию у маршрутизатора. Маршрутизатор отправляет <strong>RA<\/strong> периодически и в ответ на RS. RA сообщает префикс, длину префикса и способ настройки; адрес источника RA, LLA маршрутизатора, используется как шлюз.<\/p><table><thead><tr><th>Способ<\/th><th>Откуда адрес<\/th><th>Дополнительные параметры<\/th><\/tr><\/thead><tbody><tr><td>SLAAC<\/td><td>Префикс из RA + собственный ID<\/td><td>Из RA, если объявлены<\/td><\/tr><tr><td>SLAAC + stateless DHCPv6<\/td><td>Хост создаёт сам<\/td><td>Например, DNS из DHCPv6<\/td><\/tr><tr><td>Stateful DHCPv6<\/td><td>Выдаёт сервер<\/td><td>DNS и другие параметры от сервера<\/td><\/tr><\/tbody><\/table><p><strong>Шлюз по умолчанию получают из RA даже при stateful DHCPv6.<\/strong> DHCPv6 не заменяет RA для обнаружения маршрутизатора.<\/p>", "en": "<p>A host sends <strong>RS<\/strong> to request router information. Routers send <strong>RA<\/strong> periodically and in response to RS. RA provides the prefix, prefix length and configuration guidance; the RA source, the router's LLA, supplies the default-router address.<\/p><table><thead><tr><th>Method<\/th><th>Address source<\/th><th>Other information<\/th><\/tr><\/thead><tbody><tr><td>SLAAC<\/td><td>RA prefix + host-generated ID<\/td><td>RA, when advertised<\/td><\/tr><tr><td>SLAAC + stateless DHCPv6<\/td><td>Host generates its address<\/td><td>For example, DNS from DHCPv6<\/td><\/tr><tr><td>Stateful DHCPv6<\/td><td>Server assigns the address<\/td><td>DNS and other server parameters<\/td><\/tr><\/tbody><\/table><p><strong>The default gateway comes from RA even with stateful DHCPv6.<\/strong> DHCPv6 does not replace RA for discovering the default router.<\/p>"}}, {"heading": {"ru": "4. EUI-64 и настройка интерфейса", "en": "4. EUI-64 and interface configuration"}, "html": {"ru": "<p>В modified EUI-64 внутрь 48-битного MAC вставляют <code>fffe<\/code>, затем инвертируют U/L-бит первого октета. Получается 64-битный ID. Пример лекции: <code>fc:99:47:75:ce:e0 → fe99:47ff:fe75:cee0<\/code>. Альтернатива — случайно сформированный ID; адрес не обязан раскрывать MAC.<\/p><pre><code>configure terminal\ninterface gigabitethernet 0/0/0\nipv6 address 2001:db8:acad:1::1/64\nipv6 address fe80::1 link-local\nno shutdown\nend\nshow ipv6 interface brief<\/code><\/pre><p>Команды настройки вводятся в соответствующем режиме IOS; <code>show<\/code> запускают из привилегированного EXEC. LLA должен быть уникальным на своём канале; одинаковые LLA допустимы на разных каналах. Уточнение к слайду 38: бит именно <em>инвертируется<\/em>, а не всегда меняется только с 0 на 1 (<a href=\"https://www.rfc-editor.org/rfc/rfc4291\">RFC 4291<\/a>).<\/p>", "en": "<p>Modified EUI-64 inserts <code>fffe<\/code> into a 48-bit MAC address, then flips the U/L bit of the first octet, producing a 64-bit identifier. The lecture example is <code>fc:99:47:75:ce:e0 → fe99:47ff:fe75:cee0<\/code>. A randomly generated identifier is an alternative; an IPv6 address need not expose the MAC address.<\/p><pre><code>configure terminal\ninterface gigabitethernet 0/0/0\nipv6 address 2001:db8:acad:1::1/64\nipv6 address fe80::1 link-local\nno shutdown\nend\nshow ipv6 interface brief<\/code><\/pre><p>Enter configuration commands in their corresponding IOS modes; run <code>show<\/code> from privileged EXEC. An LLA must be unique on its own link, but can be reused on different links. Precision note for slide 38: the bit is <em>inverted<\/em>, not invariably changed only from 0 to 1 (<a href=\"https://www.rfc-editor.org/rfc/rfc4291\">RFC 4291<\/a>).<\/p>"}}, {"heading": {"ru": "5. Подсети и переход с IPv4", "en": "5. Subnets and IPv4 coexistence"}, "html": {"ru": "<p>В адресе GUA выделяют глобальный префикс, Subnet ID и Interface ID. Если организация получила <code>2001:db8:acad::/48<\/code> и создаёт подсети <code>/64<\/code>, для Subnet ID остаётся <code>64 − 48 = 16<\/code> бит. Получается <strong>2<sup>16<\/sup> = 65 536 подсетей<\/strong>: <code>2001:db8:acad:1::/64<\/code>, <code>2001:db8:acad:2::/64<\/code> и так далее.<\/p><p><strong>Dual stack<\/strong> запускает IPv4 и IPv6 одновременно. <strong>Tunneling<\/strong> переносит пакет IPv6 внутри IPv4. <strong>NAT64<\/strong> переводит между IPv6 и IPv4. В тесте различай «два стека», «инкапсуляция» и «перевод»: это три разные стратегии.<\/p>", "en": "<p>A GUA contains a global routing prefix, Subnet ID and Interface ID. If a site receives <code>2001:db8:acad::/48<\/code> and creates <code>/64<\/code> subnets, the subnet field has <code>64 − 48 = 16<\/code> bits. That gives <strong>2<sup>16<\/sup> = 65,536 subnets<\/strong>, such as <code>2001:db8:acad:1::/64<\/code> and <code>2001:db8:acad:2::/64<\/code>.<\/p><p><strong>Dual stack<\/strong> runs IPv4 and IPv6 simultaneously. <strong>Tunneling<\/strong> carries an IPv6 packet inside IPv4. <strong>NAT64<\/strong> translates between IPv6 and IPv4. Distinguish “two stacks”, “encapsulation” and “translation”: these are three different migration strategies.<\/p>"}}, {"heading": {"ru": "6. ICMPv6 и поиск соседей", "en": "6. ICMPv6 and neighbor discovery"}, "html": {"ru": "<p>ICMP сообщает о достижимости и проблемах обработки IP-пакетов. <strong>Echo Request / Echo Reply<\/strong> проверяют доступность; <strong>Destination Unreachable<\/strong> сообщает о недоступной сети, узле или сервисе; <strong>Time Exceeded<\/strong> появляется при исчерпании TTL в IPv4 или Hop Limit в IPv6.<\/p><p>IPv6 Neighbor Discovery использует ICMPv6. <strong>RS/RA<\/strong> нужны для обнаружения маршрутизатора и информации о настройке. <strong>NS/NA<\/strong> используются для разрешения IPv6-адреса в MAC и проверки уникальности адреса — DAD. Для разрешения адреса отправитель знает IPv6 цели и запрашивает её MAC. Это не ARP: в IPv6 соответствующую задачу выполняет Neighbor Discovery.<\/p>", "en": "<p>ICMP reports reachability and problems processing IP packets. <strong>Echo Request / Echo Reply<\/strong> test reachability; <strong>Destination Unreachable<\/strong> reports an unavailable network, host or service; <strong>Time Exceeded<\/strong> reports an exhausted IPv4 TTL or IPv6 Hop Limit.<\/p><p>IPv6 Neighbor Discovery uses ICMPv6. <strong>RS/RA<\/strong> discover routers and configuration information. <strong>NS/NA<\/strong> support IPv6-to-MAC address resolution and duplicate address detection, or DAD. For address resolution, the sender knows the target IPv6 address and requests its MAC address. This is not ARP: Neighbor Discovery performs the corresponding task in IPv6.<\/p>"}}, {"heading": {"ru": "7. Ping и traceroute", "en": "7. Ping and traceroute"}, "html": {"ru": "<p><code>ping<\/code> проверяет достижимость с помощью Echo Request / Reply и показывает задержку туда-обратно. Сначала проверь loopback <code>::1<\/code> или <code>127.0.0.1<\/code>, затем шлюз, затем удалённый адрес. Так можно отделить локальную проблему от проблемы за пределами LAN.<\/p><p><code>traceroute<\/code> / <code>tracert<\/code> исследует путь: TTL или Hop Limit увеличивается с 1 до 2, 3 и далее; промежуточные маршрутизаторы отвечают Time Exceeded. Звёздочка означает отсутствие ответа на конкретную пробу, а не доказанный отказ маршрутизатора. Неудачный ping также не доказывает, что узел выключен: ICMP может фильтроваться; первая проба иногда теряется во время разрешения адреса.<\/p>", "en": "<p><code>ping<\/code> tests reachability using Echo Request / Reply and reports round-trip delay. Test loopback <code>::1<\/code> or <code>127.0.0.1<\/code> first, then the gateway, then a remote address. This helps separate a local host issue from a problem beyond the LAN.<\/p><p><code>traceroute<\/code> / <code>tracert<\/code> explores the path: TTL or Hop Limit rises from 1 to 2, 3 and onward, and intermediate routers return Time Exceeded. An asterisk means no response to that probe, not proof of router failure. A failed ping does not prove a host is off: ICMP can be filtered, and the first probe may time out while address resolution occurs.<\/p>"}}], "traps": [{"ru": "В IPv6 нет broadcast; multicast не означает anycast.", "en": "IPv6 has no broadcast; multicast is not anycast."}, {"ru": "LLA не маршрутизируется между сетями, даже если это адрес шлюза.", "en": "An LLA is not routed between networks, even when used as the gateway address."}, {"ru": "DHCPv6 не выдаёт шлюз по умолчанию: его узнают из RA.", "en": "DHCPv6 does not supply the default gateway; it is learned from RA."}, {"ru": ":: допускается один раз; удалять можно ведущие, но не конечные нули.", "en": "Use :: only once; remove leading, not trailing, zeros."}, {"ru": "Ping проверяет достижимость; traceroute показывает отвечающие узлы пути.", "en": "Ping tests reachability; traceroute reveals responding hops along the path."}]}, {"id": "l8", "lecture": 8, "title": {"ru": "Транспортный уровень: TCP, UDP и порты", "en": "Transport layer: TCP, UDP and ports"}, "summary": {"ru": "Сравни надёжность TCP и простоту UDP, разбери соединение и нумерацию байтов, запомни порты и отличия MSS от окна.", "en": "Compare TCP reliability with UDP simplicity, trace connection setup and byte numbering, and distinguish ports, MSS and the receive window."}, "sourcePages": "1–45", "sections": [{"heading": {"ru": "1. Задача транспортного уровня", "en": "1. What the transport layer does"}, "html": {"ru": "<p>IP доставляет пакеты между узлами, а транспортный уровень обеспечивает логическое взаимодействие <strong>приложений<\/strong> на этих узлах. Он разделяет данные, добавляет заголовок, различает параллельные разговоры и передаёт полученные данные правильному процессу. Мультиплексирование позволяет браузеру, почте и другим приложениям использовать сеть одновременно.<\/p><p><strong>Порт<\/strong> определяет приложение или сервис; IP-адрес определяет сетевой интерфейс. <strong>Socket<\/strong> в контексте лекции — сочетание IP-адреса и порта. Например, <code>192.168.1.10:51000<\/code> обращается к <code>192.168.1.20:80<\/code>. В ответном трафике адреса и порты источника и назначения меняются местами. TCP и UDP имеют отдельные пространства портов.<\/p>", "en": "<p>IP delivers packets between hosts, while the transport layer provides logical communication between <strong>applications<\/strong> on those hosts. It divides data, adds headers, distinguishes concurrent conversations and directs received data to the correct process. Multiplexing lets a browser, mail client and other applications share a network at the same time.<\/p><p>A <strong>port<\/strong> identifies an application or service; an IP address identifies a network interface. A <strong>socket<\/strong>, in this lecture's terminology, combines an IP address and a port. For example, <code>192.168.1.10:51000<\/code> contacts <code>192.168.1.20:80<\/code>. Source and destination addresses and ports reverse in the reply. TCP and UDP have separate port spaces.<\/p>"}}, {"heading": {"ru": "2. TCP или UDP?", "en": "2. TCP or UDP?"}, "html": {"ru": "<table><thead><tr><th>Признак<\/th><th>TCP<\/th><th>UDP<\/th><\/tr><\/thead><tbody><tr><td>Соединение<\/td><td>Устанавливается<\/td><td>Не устанавливается<\/td><\/tr><tr><td>Порядок данных<\/td><td>Восстанавливается<\/td><td>Не гарантируется<\/td><\/tr><tr><td>Подтверждения и повторы<\/td><td>Есть<\/td><td>Нет на уровне UDP<\/td><\/tr><tr><td>Управление потоком<\/td><td>Есть<\/td><td>Нет<\/td><\/tr><tr><td>Заголовок<\/td><td>Минимум 20 байт<\/td><td>8 байт<\/td><\/tr><\/tbody><\/table><p>TCP подходит, когда важны полнота и порядок данных. UDP полезен для небольших запросов и ответов, передачи с чувствительностью к задержке или приложений, реализующих надёжность самостоятельно. В лекции примеры UDP — DNS, DHCP, VoIP, TFTP и SNMP. «UDP ненадёжен» означает отсутствие гарантий самого транспорта, а не обязательную потерю каждого пакета.<\/p>", "en": "<table><thead><tr><th>Feature<\/th><th>TCP<\/th><th>UDP<\/th><\/tr><\/thead><tbody><tr><td>Connection<\/td><td>Established first<\/td><td>No setup<\/td><\/tr><tr><td>Data order<\/td><td>Restored<\/td><td>Not guaranteed<\/td><\/tr><tr><td>ACKs and retransmissions<\/td><td>Provided<\/td><td>Not provided by UDP<\/td><\/tr><tr><td>Flow control<\/td><td>Provided<\/td><td>Not provided<\/td><\/tr><tr><td>Header<\/td><td>At least 20 bytes<\/td><td>8 bytes<\/td><\/tr><\/tbody><\/table><p>TCP suits applications requiring complete, ordered data. UDP suits small request/reply exchanges, delay-sensitive traffic, or applications implementing their own reliability. Lecture examples include DNS, DHCP, VoIP, TFTP and SNMP. “Unreliable UDP” means the transport gives no delivery guarantee, not that every packet is necessarily lost.<\/p>"}}, {"heading": {"ru": "3. Заголовки и подтверждение байтов", "en": "3. Headers and byte acknowledgments"}, "html": {"ru": "<p>TCP содержит порты источника и назначения, Sequence Number, Acknowledgment Number, флаги, окно, контрольную сумму и другие поля. <strong>Sequence Number<\/strong> помогает восстановить порядок, а <strong>ACK Number<\/strong> указывает следующий ожидаемый байт. Если сегмент начинается с байта 1000 и несёт 500 байт данных, следующий ожидаемый байт — <strong>1500<\/strong>. SACK позволяет сообщать о полученных участках, даже если между ними есть пропуски.<\/p><p>У UDP четыре поля: Source Port, Destination Port, Length, Checksum, каждое по 16 бит. Контрольная сумма проверяет ошибки, но не организует повторную передачу. Уточнение к слайду 19: <strong>UDP Length включает заголовок и данные<\/strong>, поэтому минимальное значение — 8 байт (<a href=\"https://www.rfc-editor.org/rfc/rfc768\">RFC 768<\/a>).<\/p>", "en": "<p>TCP includes source and destination ports, Sequence Number, Acknowledgment Number, flags, window, checksum and other fields. The <strong>Sequence Number<\/strong> supports ordering; the <strong>ACK Number<\/strong> identifies the next expected byte. If a data segment begins at byte 1000 and carries 500 bytes, the next expected byte is <strong>1500<\/strong>. SACK can report received ranges even when gaps remain between them.<\/p><p>UDP has four fields: Source Port, Destination Port, Length and Checksum, each 16 bits. A checksum detects errors; it does not organize retransmission. Precision note for slide 19: <strong>UDP Length includes both header and data<\/strong>, so its minimum value is 8 bytes (<a href=\"https://www.rfc-editor.org/rfc/rfc768\">RFC 768<\/a>).<\/p>"}}, {"heading": {"ru": "4. Установление и закрытие TCP", "en": "4. Establishing and closing TCP"}, "html": {"ru": "<p>Обычный three-way handshake: <strong>SYN → SYN-ACK → ACK<\/strong>. Клиент запрашивает соединение, сервер подтверждает запрос и отправляет свой SYN, клиент подтверждает ответ. Это проверяет наличие сервиса и синхронизирует номера последовательности. SYN расходует один номер последовательности.<\/p><p>Типичное закрытие в лекции: <strong>FIN → ACK → FIN → ACK<\/strong>. Направления закрываются отдельно. FIN означает, что отправитель закончил передачу; RST резко сбрасывает соединение. PSH — указание передать данные приложению без лишнего ожидания; URG связан с полем urgent pointer. Соединение TCP является состоянием протокола на узлах, а не выделенным физическим кабелем.<\/p>", "en": "<p>The usual three-way handshake is <strong>SYN → SYN-ACK → ACK<\/strong>. The client requests a connection; the server acknowledges and sends its own SYN; the client acknowledges that response. This verifies an active service and synchronizes sequence numbers. SYN consumes one sequence number.<\/p><p>The lecture's typical shutdown is <strong>FIN → ACK → FIN → ACK<\/strong>. The two directions close separately. FIN means the sender has finished sending; RST abruptly resets a connection. PSH requests delivery to the application without unnecessary waiting, while URG relates to the urgent pointer. A TCP connection is protocol state at the endpoints, not a dedicated physical cable.<\/p>"}}, {"heading": {"ru": "5. Окно, MSS и перегрузка", "en": "5. Window, MSS and congestion"}, "html": {"ru": "<p><strong>Flow control<\/strong> защищает получателя: объявленное окно показывает объём данных, который он способен принять. <strong>Congestion control<\/strong> реагирует на перегрузку сети, например потери у перегруженного маршрутизатора. Это разные ограничения скорости.<\/p><p><strong>MSS<\/strong> ограничивает данные TCP в одном сегменте. Для MTU 1500 байт, IPv4-заголовка 20 байт и TCP-заголовка 20 байт без опций: <code>MSS = 1500 − 20 − 20 = 1460 байт<\/code>. MTU включает IP-пакет, а MSS — только данные TCP. Окно может охватывать много сегментов; его нельзя приравнивать к MSS. Пропавшие неподтверждённые данные TCP повторно передаёт, а UDP сам этого не делает.<\/p>", "en": "<p><strong>Flow control<\/strong> protects the receiver: its advertised window indicates the amount of data it can accept. <strong>Congestion control<\/strong> responds to network overload, such as losses at an overloaded router. These are different limits on sending rate.<\/p><p><strong>MSS<\/strong> limits TCP payload in one segment. With an MTU of 1500 bytes, a 20-byte IPv4 header and a 20-byte TCP header without options: <code>MSS = 1500 − 20 − 20 = 1460 bytes<\/code>. MTU covers the IP packet; MSS covers only TCP data. A window can span many segments and is not the same as MSS. TCP retransmits missing unacknowledged data; UDP itself does not.<\/p>"}}, {"heading": {"ru": "6. Диапазоны портов и сервисы", "en": "6. Port ranges and services"}, "html": {"ru": "<p>Порт — 16-битное число. <strong>Well-known:<\/strong> 0–1023; <strong>registered:<\/strong> 1024–49151; <strong>dynamic/private:<\/strong> 49152–65535. В учебной модели клиент обычно выбирает временный исходный порт, а обращается к известному порту сервера.<\/p><table><thead><tr><th>Сервис<\/th><th>Порт и транспорт<\/th><\/tr><\/thead><tbody><tr><td>FTP: данные / управление<\/td><td>TCP 20 / 21<\/td><\/tr><tr><td>SSH / Telnet / SMTP<\/td><td>TCP 22 / 23 / 25<\/td><\/tr><tr><td>DNS<\/td><td>UDP и TCP 53<\/td><\/tr><tr><td>DHCP: сервер / клиент<\/td><td>UDP 67 / 68<\/td><\/tr><tr><td>TFTP / SNMP<\/td><td>UDP 69 / 161<\/td><\/tr><tr><td>HTTP / HTTPS<\/td><td>TCP 80 / 443<\/td><\/tr><tr><td>POP3 / IMAP<\/td><td>TCP 110 / 143<\/td><\/tr><\/tbody><\/table><p>Это базовые соответствия из лекции. Для FTP порт данных 20 относится к классическому активному режиму. <code>netstat<\/code> показывает сетевые соединения, адреса, порты и состояния TCP, например ESTABLISHED.<\/p>", "en": "<p>A port is a 16-bit number. <strong>Well-known:<\/strong> 0–1023; <strong>registered:<\/strong> 1024–49151; <strong>dynamic/private:<\/strong> 49152–65535. In the teaching model, a client usually selects an ephemeral source port and contacts a known server port.<\/p><table><thead><tr><th>Service<\/th><th>Port and transport<\/th><\/tr><\/thead><tbody><tr><td>FTP: data / control<\/td><td>TCP 20 / 21<\/td><\/tr><tr><td>SSH / Telnet / SMTP<\/td><td>TCP 22 / 23 / 25<\/td><\/tr><tr><td>DNS<\/td><td>UDP and TCP 53<\/td><\/tr><tr><td>DHCP: server / client<\/td><td>UDP 67 / 68<\/td><\/tr><tr><td>TFTP / SNMP<\/td><td>UDP 69 / 161<\/td><\/tr><tr><td>HTTP / HTTPS<\/td><td>TCP 80 / 443<\/td><\/tr><tr><td>POP3 / IMAP<\/td><td>TCP 110 / 143<\/td><\/tr><\/tbody><\/table><p>These are the lecture's basic mappings. FTP data port 20 applies to classic active mode. <code>netstat<\/code> displays network connections, addresses, ports and TCP states such as ESTABLISHED.<\/p>"}}], "traps": [{"ru": "ACK означает следующий ожидаемый байт, а не номер последнего принятого байта.", "en": "ACK identifies the next expected byte, not the last received byte."}, {"ru": "UDP имеет контрольную сумму, но не подтверждения и не повторную передачу.", "en": "UDP has a checksum, but no acknowledgments or retransmission."}, {"ru": "MSS — данные одного TCP-сегмента; окно — допустимый объём данных в потоке.", "en": "MSS is one TCP segment's payload; the window limits outstanding stream data."}, {"ru": "Порт 53 используется DNS как с UDP, так и с TCP.", "en": "DNS uses port 53 with both UDP and TCP."}, {"ru": "SYN устанавливает соединение, FIN завершает направление, RST сбрасывает соединение.", "en": "SYN establishes a connection, FIN closes one direction, RST resets it."}]}, {"id": "l9", "lecture": 9, "title": {"ru": "Прикладной уровень: Web, почта, DNS и DHCP", "en": "Application layer: web, email, DNS and DHCP"}, "summary": {"ru": "Свяжи протокол с задачей: открыть страницу, отправить письмо, узнать IP, получить настройки или обратиться к файлам.", "en": "Match each protocol to its job: open a page, send mail, resolve an address, obtain configuration or access files."}, "sourcePages": "1–48", "sections": [{"heading": {"ru": "1. Три верхних уровня OSI", "en": "1. The top three OSI layers"}, "html": {"ru": "<p>Прикладной уровень TCP/IP объединяет функции трёх верхних уровней OSI. <strong>Application<\/strong> предоставляет сетевые службы приложениям; примеры — HTTP, FTP и DNS. <strong>Presentation<\/strong> отвечает за представление и формат данных, сжатие, шифрование и обратные операции. <strong>Session<\/strong> организует и поддерживает диалоги приложений, помогает возобновлять их после перерыва.<\/p><p>Протоколы на обоих концах должны быть совместимы по формату и смыслу сообщений. Вопрос «что выполняет шифрование в OSI?» относится к Presentation. Уточнение к слайду 9: SYN/SYN-ACK/ACK — это механизм TCP <strong>транспортного уровня<\/strong>, несмотря на заголовок Session Layer на слайде (<a href=\"https://www.rfc-editor.org/rfc/rfc9293\">RFC 9293<\/a>).<\/p>", "en": "<p>The TCP/IP application layer combines functions from the top three OSI layers. <strong>Application<\/strong> provides network services to applications; examples include HTTP, FTP and DNS. <strong>Presentation<\/strong> handles data representation and formatting, compression, encryption and their reverse operations. <strong>Session<\/strong> creates and maintains application dialogs and supports resuming interrupted dialogs.<\/p><p>Protocols at both ends must agree on message format and meaning. “Which OSI layer handles encryption?” refers to Presentation. Precision note for slide 9: SYN/SYN-ACK/ACK is a TCP mechanism at the <strong>transport layer<\/strong>, despite that slide's Session Layer heading (<a href=\"https://www.rfc-editor.org/rfc/rfc9293\">RFC 9293<\/a>).<\/p>"}}, {"heading": {"ru": "2. Как открывается веб-страница", "en": "2. How a web page opens"}, "html": {"ru": "<p>Для <code>http://www.cisco.com/index.html<\/code> схема — <code>http<\/code>, имя сервера — <code>www.cisco.com<\/code>, путь — <code>/index.html<\/code>. Браузер узнаёт IP через DNS, устанавливает необходимое соединение, отправляет HTTP-запрос и получает ответ. Затем он интерпретирует HTML и отображает страницу. <strong>HTTP — протокол обмена; HTML — язык разметки содержимого.<\/strong><\/p><p><strong>GET<\/strong> запрашивает ресурс; <strong>POST<\/strong> отправляет данные на обработку, например форму; <strong>PUT<\/strong> загружает или заменяет ресурс по указанному адресу. HTTP работает по модели request/response. В базовой таблице лекций HTTP использует TCP 80, HTTPS — TCP 443. HTTPS защищает HTTP-обмен шифрованием; наличие HTTPS не меняет назначение DNS или HTML.<\/p>", "en": "<p>For <code>http://www.cisco.com/index.html<\/code>, the scheme is <code>http<\/code>, the server name is <code>www.cisco.com<\/code>, and the path is <code>/index.html<\/code>. The browser resolves the IP address through DNS, establishes the required connection, sends an HTTP request and receives a response. It then interprets HTML and renders the page. <strong>HTTP is the exchange protocol; HTML is the content markup language.<\/strong><\/p><p><strong>GET<\/strong> requests a resource; <strong>POST<\/strong> submits data for processing, such as a form; <strong>PUT<\/strong> uploads or replaces a resource at the specified address. HTTP uses request/response communication. The lectures' basic mapping is TCP 80 for HTTP and TCP 443 for HTTPS. HTTPS encrypts the HTTP exchange; it does not replace DNS or HTML.<\/p>"}}, {"heading": {"ru": "3. SMTP, POP3 и IMAP", "en": "3. SMTP, POP3 and IMAP"}, "html": {"ru": "<p>Электронная почта использует store-and-forward: сервер может хранить сообщение и отправить его позднее, если следующий сервер временно недоступен. <strong>SMTP<\/strong> отправляет и пересылает почту; базовый порт из лекции — TCP 25. <strong>POP3<\/strong> и <strong>IMAP<\/strong> предоставляют клиенту доступ к входящей почте.<\/p><table><thead><tr><th>Протокол<\/th><th>Основная роль<\/th><th>Порт<\/th><\/tr><\/thead><tbody><tr><td>SMTP<\/td><td>Отправка и пересылка<\/td><td>TCP 25<\/td><\/tr><tr><td>POP3<\/td><td>Загрузка почты клиентом<\/td><td>TCP 110<\/td><\/tr><tr><td>IMAP<\/td><td>Работа с серверным почтовым ящиком<\/td><td>TCP 143<\/td><\/tr><\/tbody><\/table><p>Учебное различие: POP загружает сообщения, часто с последующим удалением с сервера; IMAP хранит их на сервере и синхронизирует действия. Удаление при POP зависит от настроек клиента. Для нескольких устройств и общего состояния ящика ключевое слово — IMAP.<\/p>", "en": "<p>Email uses store-and-forward: a server can keep a message and retry delivery if the next server is temporarily unavailable. <strong>SMTP<\/strong> sends and relays mail; the lecture's basic port is TCP 25. <strong>POP3<\/strong> and <strong>IMAP<\/strong> let a client access received messages.<\/p><table><thead><tr><th>Protocol<\/th><th>Main role<\/th><th>Port<\/th><\/tr><\/thead><tbody><tr><td>SMTP<\/td><td>Sending and relaying mail<\/td><td>TCP 25<\/td><\/tr><tr><td>POP3<\/td><td>Downloading mail to a client<\/td><td>TCP 110<\/td><\/tr><tr><td>IMAP<\/td><td>Working with a server mailbox<\/td><td>TCP 143<\/td><\/tr><\/tbody><\/table><p>The teaching distinction is that POP downloads messages, often followed by server deletion, whereas IMAP retains them on the server and synchronizes actions. POP deletion depends on client settings. For several devices sharing mailbox state, the key answer is IMAP.<\/p>"}}, {"heading": {"ru": "4. DNS: записи и проверка", "en": "4. DNS records and troubleshooting"}, "html": {"ru": "<p><strong>DNS<\/strong> сопоставляет имена с нужными данными, в частности IP-адресами. Это не служба выдачи адресов компьютерам. Сервер ищет запись и при необходимости взаимодействует с другими серверами; результат может временно кешироваться для следующих запросов. DNS использует UDP и TCP 53.<\/p><ul><li><strong>A:<\/strong> IPv4-адрес.<\/li><li><strong>AAAA:<\/strong> IPv6-адрес.<\/li><li><strong>NS:<\/strong> авторитетный сервер имён.<\/li><li><strong>MX:<\/strong> почтовый обменник домена.<\/li><\/ul><p>Разделы DNS-сообщения: Question, Answer, Authority, Additional. Команда <code>nslookup www.cisco.com<\/code> запрашивает DNS и помогает диагностировать разрешение имён. Если соединение по IP работает, а по имени нет, проверь DNS. Полное доменное имя — <code>www.cisco.com<\/code>; <code>http://<\/code> является частью URL, а не доменного имени.<\/p>", "en": "<p><strong>DNS<\/strong> maps names to required information, including IP addresses. It does not assign host addresses. A server searches its records and, if necessary, communicates with other servers; results can be temporarily cached for later queries. DNS uses both UDP and TCP 53.<\/p><ul><li><strong>A:<\/strong> IPv4 address.<\/li><li><strong>AAAA:<\/strong> IPv6 address.<\/li><li><strong>NS:<\/strong> authoritative name server.<\/li><li><strong>MX:<\/strong> domain mail exchanger.<\/li><\/ul><p>DNS message sections are Question, Answer, Authority and Additional. The command <code>nslookup www.cisco.com<\/code> queries DNS and helps troubleshoot name resolution. If an IP connection works but its name does not, investigate DNS. The domain name is <code>www.cisco.com<\/code>; <code>http://<\/code> belongs to the URL, not the domain name.<\/p>"}}, {"heading": {"ru": "5. DHCP: настройка и DORA", "en": "5. DHCP configuration and DORA"}, "html": {"ru": "<p>DHCP для IPv4 автоматически выдаёт адрес из пула на срок аренды и может передать маску, шлюз и адрес DNS. Статическая настройка вводится вручную; динамическая получается от сервера. В лекции DHCP применяется к обычным клиентам, а стабильные адреса — к инфраструктуре, серверам и принтерам.<\/p><ol><li><strong>Discover:<\/strong> клиент ищет серверы, начальное сообщение широковещательное.<\/li><li><strong>Offer:<\/strong> сервер предлагает адрес и параметры аренды.<\/li><li><strong>Request:<\/strong> клиент сообщает, какое предложение принимает.<\/li><li><strong>Acknowledgment:<\/strong> DHCPACK подтверждает аренду.<\/li><\/ol><p>Порядок запоминается как <strong>DORA<\/strong>. Если сервер отклоняет запрошенный клиентом адрес или аренду, он отправляет DHCPNAK, и клиент начинает процесс заново. Сервер использует <strong>UDP 67<\/strong>, клиент — <strong>UDP 68<\/strong>. DHCP выдаёт настройки, DNS разрешает имена: одинаковая буква D не означает одинаковую задачу.<\/p>", "en": "<p>DHCP for IPv4 automatically leases an address from a pool and can supply a subnet mask, default gateway and DNS server. Static configuration is entered manually; dynamic configuration is obtained from a server. The lecture uses DHCP for general clients and stable addresses for infrastructure, servers and printers.<\/p><ol><li><strong>Discover:<\/strong> the client looks for servers; the initial message is broadcast.<\/li><li><strong>Offer:<\/strong> a server offers an address and lease parameters.<\/li><li><strong>Request:<\/strong> the client identifies the offer it accepts.<\/li><li><strong>Acknowledgment:<\/strong> DHCPACK confirms the lease.<\/li><\/ol><p>Remember the order as <strong>DORA<\/strong>. If the server rejects the client’s requested address or lease, it sends DHCPNAK and the client restarts the process. The server uses <strong>UDP 67<\/strong> and the client uses <strong>UDP 68<\/strong>. DHCP supplies configuration; DNS resolves names. Similar abbreviations do not mean similar jobs.<\/p>"}}, {"heading": {"ru": "6. FTP и SMB", "en": "6. FTP and SMB"}, "html": {"ru": "<p><strong>FTP<\/strong> передаёт файлы между клиентом и сервером. Он разделяет управляющий канал и канал данных. <strong>TCP 21<\/strong> используется для команд и ответов; классическая схема активного FTP связывает данные с серверным <strong>TCP 20<\/strong>. Загрузка может идти в обе стороны: upload — на сервер, download — с сервера. Число 20 не следует считать неизменным портом любого режима FTP.<\/p><p><strong>SMB<\/strong> предоставляет доступ к общим файлам, принтерам и другим ресурсам. Он управляет установлением и аутентификацией сеансов, доступом к ресурсам и обменом сообщениями. Соединение может быть длительным: удалённые ресурсы выглядят для пользователя похожими на локальные. В тесте «общая папка и сетевой принтер» указывают на SMB; «отдельный управляющий и информационный канал передачи файлов» — на FTP.<\/p>", "en": "<p><strong>FTP<\/strong> transfers files between a client and server. It separates the control connection from the data connection. <strong>TCP 21<\/strong> carries commands and replies; classic active FTP associates data transfer with server <strong>TCP 20<\/strong>. Transfers work in both directions: upload sends to the server, download retrieves from it. Port 20 should not be treated as the fixed data port for every FTP mode.<\/p><p><strong>SMB<\/strong> exposes shared files, printers and other resources. It manages session establishment and authentication, resource access and message exchange. Connections can remain open for a long time, making remote resources appear similar to local ones. In a test, “shared folder and network printer” points to SMB; “separate control and data connections for file transfer” points to FTP.<\/p>"}}], "traps": [{"ru": "Presentation отвечает за формат, сжатие и шифрование; handshake TCP относится к Transport.", "en": "Presentation handles format, compression and encryption; TCP's handshake belongs to Transport."}, {"ru": "SMTP отправляет почту; POP3 и IMAP получают доступ к входящей.", "en": "SMTP sends mail; POP3 and IMAP access received mail."}, {"ru": "A — IPv4; AAAA — IPv6; MX — почта; NS — сервер имён.", "en": "A means IPv4; AAAA IPv6; MX mail exchange; NS name server."}, {"ru": "DHCP: сервер 67, клиент 68; порядок — Discover, Offer, Request, ACK.", "en": "DHCP: server 67, client 68; order is Discover, Offer, Request, ACK."}, {"ru": "HTTP передаёт веб-сообщения, HTML описывает страницу, DNS ищет адрес.", "en": "HTTP exchanges web messages, HTML describes a page, DNS resolves the address."}]}], "questions": [{"id": 1, "chapter": "l1", "q": {"ru": "Какой способ обеспечивает защищённую удалённую CLI-сессию с сетевым устройством?", "en": "Which method provides a secure remote CLI session to a network device?"}, "options": [{"ru": "Telnet", "en": "Telnet"}, {"ru": "SSH", "en": "SSH"}, {"ru": "Console — физическое подключение", "en": "Console — a physical connection"}, {"ru": "HTTP без шифрования", "en": "Unencrypted HTTP"}], "correct": [1], "explanation": {"ru": "SSH обеспечивает защищённый удалённый доступ. Telnet передаёт команды и пароли открытым текстом; console — локальный физический способ управления.", "en": "SSH provides secure remote access. Telnet sends commands and passwords in plaintext; console is a local physical management method."}, "source": {"lecture": 1, "page": 54}}, {"id": 2, "chapter": "l1", "q": {"ru": "Какой режим IOS обозначает приглашение S1(config-line)#?", "en": "Which IOS mode is indicated by the S1(config-line)# prompt?"}, "options": [{"ru": "User EXEC", "en": "User EXEC"}, {"ru": "Privileged EXEC", "en": "Privileged EXEC"}, {"ru": "Настройка линии", "en": "Line configuration"}, {"ru": "Настройка интерфейса", "en": "Interface configuration"}], "correct": [2], "explanation": {"ru": "config-line означает настройку линии, например console или VTY. config-if обозначает интерфейс. Смотри на полный prompt, а не только на #.", "en": "config-line identifies line configuration, such as console or VTY. config-if identifies an interface. Inspect the complete prompt, not only the # symbol."}, "source": {"lecture": 1, "page": 61}}, {"id": 3, "chapter": "l1", "q": {"ru": "Какая команда сохраняет текущую конфигурацию для использования после перезагрузки?", "en": "Which command saves the current configuration for use after a reboot?"}, "options": [{"ru": "show running-config", "en": "show running-config"}, {"ru": "copy startup-config running-config", "en": "copy startup-config running-config"}, {"ru": "erase startup-config", "en": "erase startup-config"}, {"ru": "copy running-config startup-config", "en": "copy running-config startup-config"}], "correct": [3], "explanation": {"ru": "Текущая running-config находится в RAM. Копирование в startup-config сохраняет её в NVRAM. Обратное направление команды не сохраняет текущее состояние.", "en": "The current running-config is in RAM. Copying it to startup-config saves it in NVRAM. Reversing the command's direction does not save the current state."}, "source": {"lecture": 1, "page": 79}}, {"id": 4, "chapter": "l1", "q": {"ru": "Какие характеристики относятся к трём целям информационной безопасности CIA?", "en": "Which characteristics belong to the three CIA information-security goals?"}, "options": [{"ru": "Конфиденциальность", "en": "Confidentiality"}, {"ru": "Масштабируемость", "en": "Scalability"}, {"ru": "Целостность", "en": "Integrity"}, {"ru": "Доступность", "en": "Availability"}, {"ru": "Мультиплексирование", "en": "Multiplexing"}], "correct": [0, 2, 3], "explanation": {"ru": "CIA = Confidentiality, Integrity, Availability: разрешённое чтение, защита от несанкционированного изменения и своевременный доступ. Масштабируемость — другая характеристика архитектуры сети.", "en": "CIA means Confidentiality, Integrity, and Availability: authorized reading, protection against unauthorized alteration, and timely access. Scalability is a different network architecture characteristic."}, "source": {"lecture": 1, "page": 37}}, {"id": 5, "chapter": "l2", "q": {"ru": "Какой уровень OSI отвечает за сегментацию и повторную сборку данных отдельных коммуникаций?", "en": "Which OSI layer handles segmentation and reassembly of data for individual communications?"}, "options": [{"ru": "L2 — Data Link", "en": "L2 — Data Link"}, {"ru": "L3 — Network", "en": "L3 — Network"}, {"ru": "L4 — Transport", "en": "L4 — Transport"}, {"ru": "L6 — Presentation", "en": "L6 — Presentation"}], "correct": [2], "explanation": {"ru": "Transport — четвёртый уровень. В модели TCP/IP ему соответствует Transport. Канальный уровень работает с кадрами, а сетевой — с пакетами.", "en": "Transport is Layer 4 and corresponds to the TCP/IP transport layer. The data link layer handles frames, while the network layer handles packets."}, "source": {"lecture": 2, "page": 36}}, {"id": 6, "chapter": "l2", "q": {"ru": "Какой порядок PDU соответствует инкапсуляции при отправке данных через TCP?", "en": "Which PDU order represents encapsulation when sending data using TCP?"}, "options": [{"ru": "Data → Segment → Packet → Frame → Bits", "en": "Data → Segment → Packet → Frame → Bits"}, {"ru": "Data → Packet → Segment → Frame → Bits", "en": "Data → Packet → Segment → Frame → Bits"}, {"ru": "Bits → Frame → Packet → Segment → Data", "en": "Bits → Frame → Packet → Segment → Data"}, {"ru": "Data → Frame → Packet → Segment → Bits", "en": "Data → Frame → Packet → Segment → Bits"}], "correct": [0], "explanation": {"ru": "При движении вниз по стеку к данным добавляется информация транспортного, сетевого и канального уровней, после чего физический уровень передаёт биты. Обратный порядок — деинкапсуляция.", "en": "Moving down the stack adds transport, network, and data link information, after which the physical layer transmits bits. The reverse order is de-encapsulation."}, "source": {"lecture": 2, "page": 42}}, {"id": 7, "chapter": "l2", "q": {"ru": "PC отправляет данные серверу в другой IP-сети. Какой destination MAC должен иметь первый Ethernet-кадр?", "en": "A PC sends data to a server in another IP network. What destination MAC should the first Ethernet frame use?"}, "options": [{"ru": "MAC удалённого сервера", "en": "The remote server's MAC"}, {"ru": "MAC любого коммутатора на пути", "en": "The MAC of any switch on the path"}, {"ru": "Собственный MAC компьютера", "en": "The PC's own MAC"}, {"ru": "MAC локального интерфейса шлюза по умолчанию", "en": "The MAC of the default gateway's local interface"}], "correct": [3], "explanation": {"ru": "Первый кадр должен доставить пакет ближайшему маршрутизатору. IP назначения остаётся адресом конечного сервера, но destination MAC — адресом локального шлюза.", "en": "The first frame delivers the packet to the next router. The destination IP remains the final server's address, but the destination MAC is the local gateway's address."}, "source": {"lecture": 2, "page": 54}}, {"id": 8, "chapter": "l2", "q": {"ru": "Какая организация разрабатывает, обновляет и поддерживает интернет-протоколы и технологии TCP/IP?", "en": "Which organization develops, updates, and maintains Internet protocols and TCP/IP technologies?"}, "options": [{"ru": "IETF", "en": "IETF"}, {"ru": "IRTF", "en": "IRTF"}, {"ru": "TIA", "en": "TIA"}, {"ru": "EIA", "en": "EIA"}], "correct": [0], "explanation": {"ru": "Это IETF. IRTF занимается долгосрочными исследованиями; TIA/EIA ассоциируются с телекоммуникационной и кабельной инфраструктурой.", "en": "This is the IETF. The IRTF focuses on long-term research; TIA/EIA are associated with telecommunications and wiring infrastructure."}, "source": {"lecture": 2, "page": 30}}, {"id": 9, "chapter": "l2", "q": {"ru": "Как называется доставка сообщения выбранной группе получателей, которая не обязана включать все устройства?", "en": "What is delivery to a selected group of recipients that does not have to include all devices called?"}, "options": [{"ru": "Unicast", "en": "Unicast"}, {"ru": "Multicast", "en": "Multicast"}, {"ru": "Broadcast", "en": "Broadcast"}, {"ru": "Encoding", "en": "Encoding"}], "correct": [1], "explanation": {"ru": "Multicast — одному выбранному набору получателей. Unicast — одному, broadcast — всем в соответствующей области рассылки. Encoding описывает представление информации, а не аудиторию доставки.", "en": "Multicast targets a selected group. Unicast targets one recipient; broadcast targets all within its scope. Encoding describes information representation, not the delivery audience."}, "source": {"lecture": 2, "page": 15}}, {"id": 10, "chapter": "l3", "q": {"ru": "Измеренный throughput равен 80 Мбит/с, из них 8 Мбит/с — служебные расходы. Чему равен goodput?", "en": "Measured throughput is 80 Mbps, including 8 Mbps of overhead. What is the goodput?"}, "options": [{"ru": "8 Мбит/с", "en": "8 Mbps"}, {"ru": "80 Мбит/с", "en": "80 Mbps"}, {"ru": "72 Мбит/с", "en": "72 Mbps"}, {"ru": "88 Мбит/с", "en": "88 Mbps"}], "correct": [2], "explanation": {"ru": "Goodput учитывает полезные данные: 80 − 8 = 72 Мбит/с. Это не latency, потому что latency измеряет время прохождения, а не скорость.", "en": "Goodput counts usable data: 80 − 8 = 72 Mbps. This is not latency, which measures travel time rather than a rate."}, "source": {"lecture": 3, "page": 15}}, {"id": 11, "chapter": "l3", "q": {"ru": "Какую среду лучше выбрать для соединения зданий при сильных электромагнитных помехах?", "en": "Which medium is best suited to an interbuilding link exposed to strong electromagnetic interference?"}, "options": [{"ru": "UTP", "en": "UTP"}, {"ru": "Оптоволокно", "en": "Optical fiber"}, {"ru": "Экранированная витая пара (STP)", "en": "Shielded twisted pair (STP)"}, {"ru": "Коаксиальный кабель", "en": "Coaxial cable"}], "correct": [1], "explanation": {"ru": "Оптоволокно передаёт свет и невосприимчиво к EMI/RFI. Лекция рекомендует его для магистралей и соединения зданий.", "en": "Fiber transmits light and is immune to EMI/RFI. The lecture identifies backbones and interbuilding links as suitable uses."}, "source": {"lecture": 3, "page": 35}}, {"id": 12, "chapter": "l3", "q": {"ru": "Какие десятичное и hex-значения соответствуют двоичному числу 10101000?", "en": "Which decimal and hexadecimal values correspond to binary 10101000?"}, "options": [{"ru": "160 и A0", "en": "160 and A0"}, {"ru": "168 и 8A", "en": "168 and 8A"}, {"ru": "138 и A8", "en": "138 and A8"}, {"ru": "168 и A8", "en": "168 and A8"}], "correct": [3], "explanation": {"ru": "128 + 32 + 8 = 168. Разделяем 10101000 на 1010 и 1000: это A и 8, значит A8.", "en": "128 + 32 + 8 = 168. Split 10101000 into 1010 and 1000: these are A and 8, giving A8."}, "source": {"lecture": 3, "page": 52}}, {"id": 13, "chapter": "l3", "q": {"ru": "Какие утверждения о UTP верны?", "en": "Which statements about UTP are correct?"}, "options": [{"ru": "Обычно содержит четыре витые пары медных проводов", "en": "It normally contains four twisted pairs of copper wires"}, {"ru": "Передаёт данные световыми импульсами", "en": "It transmits data as light pulses"}, {"ru": "Не имеет металлического экрана", "en": "It has no metallic shield"}, {"ru": "Полностью невосприимчив к EMI/RFI", "en": "It is completely immune to EMI/RFI"}, {"ru": "Для обычного Ethernet использует разъём SC", "en": "It uses an SC connector for ordinary Ethernet"}], "correct": [0, 2], "explanation": {"ru": "UTP — unshielded twisted pair: четыре витые медные пары без металлического экрана. Обычно используется RJ-45. Свет, SC и полная невосприимчивость к EMI относятся к оптоволокну.", "en": "UTP means unshielded twisted pair: four twisted copper pairs without a metallic shield. It commonly uses RJ-45. Light, SC connectors, and EMI immunity are associated with fiber."}, "source": {"lecture": 3, "page": 25}}, {"id": 14, "chapter": "l4", "q": {"ru": "Каков минимальный размер обычного Ethernet-кадра без преамбулы и SFD?", "en": "What is the minimum normal Ethernet frame size, excluding preamble and SFD?"}, "options": [{"ru": "46 байт", "en": "46 bytes"}, {"ru": "64 байта", "en": "64 bytes"}, {"ru": "1500 байт", "en": "1500 bytes"}, {"ru": "1518 байт", "en": "1518 bytes"}], "correct": [1], "explanation": {"ru": "Минимум — 64 байта. 1500 байт — обычный максимум полезной нагрузки; 1518 — максимум нетегированного кадра.", "en": "The minimum is 64 bytes. 1500 bytes is the normal maximum payload; 1518 is the untagged frame maximum."}, "source": {"lecture": 4, "page": 12}}, {"id": 15, "chapter": "l4", "q": {"ru": "По каким данным коммутатор обучает свою MAC-таблицу при получении кадра?", "en": "Which information does a switch use to learn its MAC table from an incoming frame?"}, "options": [{"ru": "MAC назначения и выходной порт", "en": "Destination MAC and outgoing port"}, {"ru": "IP источника и маска", "en": "Source IP and subnet mask"}, {"ru": "MAC источника и входной порт", "en": "Source MAC and incoming port"}, {"ru": "IP назначения и шлюз", "en": "Destination IP and gateway"}], "correct": [2], "explanation": {"ru": "Обучение использует source MAC и порт входа. Destination MAC затем используется для решения о пересылке.", "en": "Learning uses the source MAC and incoming port. The destination MAC is then used for forwarding."}, "source": {"lecture": 4, "page": 39}}, {"id": 16, "chapter": "l4", "q": {"ru": "Куда коммутатор отправит unknown unicast, если MAC назначения отсутствует в таблице?", "en": "Where does a switch send an unknown unicast when the destination MAC is absent from its table?"}, "options": [{"ru": "На остальные порты того же VLAN, кроме входного", "en": "To other ports in the same VLAN, except the incoming port"}, {"ru": "Только обратно во входной порт", "en": "Only back through the incoming port"}, {"ru": "Всегда только на шлюз", "en": "Always only to the default gateway"}, {"ru": "Никуда: каждый неизвестный unicast отбрасывается", "en": "Nowhere: every unknown unicast is discarded"}], "correct": [0], "explanation": {"ru": "Это flooding неизвестного unicast. Коммутатор ещё не знает, за каким портом находится получатель.", "en": "This is unknown-unicast flooding. The switch has not yet learned the recipient’s port."}, "source": {"lecture": 4, "page": 40}}, {"id": 17, "chapter": "l4", "q": {"ru": "Какой метод получает кадр целиком и проверяет CRC до его пересылки?", "en": "Which method receives the entire frame and checks its CRC before forwarding?"}, "options": [{"ru": "Fast-forward", "en": "Fast-forward"}, {"ru": "Fragment-free", "en": "Fragment-free"}, {"ru": "Любой cut-through", "en": "Every cut-through method"}, {"ru": "Store-and-forward", "en": "Store-and-forward"}], "correct": [3], "explanation": {"ru": "Store-and-forward проверяет весь кадр и отбрасывает повреждённые. Cut-through начинает отправку до полного получения.", "en": "Store-and-forward checks the whole frame and discards corrupted ones. Cut-through starts before complete reception."}, "source": {"lecture": 4, "page": 49}}, {"id": 18, "chapter": "l4", "q": {"ru": "Какие утверждения о доступе к среде верны?", "en": "Which statements about media access are correct?"}, "options": [{"ru": "CSMA/CD применяется в старом half-duplex Ethernet", "en": "CSMA/CD is used in legacy half-duplex Ethernet"}, {"ru": "CSMA/CA применяется в IEEE 802.11 WLAN", "en": "CSMA/CA is used in IEEE 802.11 WLANs"}, {"ru": "Full-duplex Ethernet требует CSMA/CD", "en": "Full-duplex Ethernet requires CSMA/CD"}, {"ru": "CSMA/CA гарантирует полное отсутствие коллизий", "en": "CSMA/CA guarantees that collisions never occur"}], "correct": [0, 1], "explanation": {"ru": "CD обнаруживает коллизии в старой общей Ethernet-среде. CA снижает вероятность коллизий в WLAN. Full-duplex Ethernet не требует CSMA/CD.", "en": "CD detects collisions on legacy shared Ethernet. CA reduces collision probability in WLANs. Full-duplex Ethernet does not require CSMA/CD."}, "source": {"lecture": 4, "page": 21}}, {"id": 19, "chapter": "l5", "q": {"ru": "Какое свойство IP означает отсутствие гарантии доставки пакета?", "en": "Which IP characteristic means packet delivery is not guaranteed?"}, "options": [{"ru": "Connection-oriented", "en": "Connection-oriented"}, {"ru": "Best effort", "en": "Best effort"}, {"ru": "Full-duplex", "en": "Full-duplex"}, {"ru": "Address resolution", "en": "Address resolution"}], "correct": [1], "explanation": {"ru": "Best effort означает отсутствие собственных гарантий доставки и повторной передачи. Connectionless отдельно означает отсутствие предварительного установления соединения.", "en": "Best effort provides no delivery or retransmission guarantee. Connectionless separately means no connection is established beforehand."}, "source": {"lecture": 5, "page": 12}}, {"id": 20, "chapter": "l5", "q": {"ru": "ПК знает IPv4-адрес принтера в своей подсети, но соответствующей записи в ARP-кеше нет. Что он отправит для поиска MAC-адреса?", "en": "A PC knows the IPv4 address of a printer in its own subnet, but has no matching ARP-cache entry. What does it send to discover the MAC address?"}, "options": [{"ru": "DNS-запрос на имя принтера", "en": "A DNS query for the printer’s name"}, {"ru": "ICMPv6 Router Advertisement", "en": "An ICMPv6 Router Advertisement"}, {"ru": "Широковещательный ARP request в локальной сети", "en": "A broadcast ARP request on the local network"}, {"ru": "TCP SYN на порт 80 принтера", "en": "A TCP SYN to the printer’s port 80"}], "correct": [2], "explanation": {"ru": "ARP разрешает известный локальный IPv4-адрес в MAC. При отсутствии записи хост отправляет ARP request, который получают устройства локальной сети. DNS разрешает имена, а ICMPv6 относится к IPv6.", "en": "ARP resolves a known local IPv4 address to a MAC address. Without a cache entry, the host broadcasts an ARP request to the local network. DNS resolves names, while ICMPv6 is used with IPv6."}, "source": {"lecture": 5, "page": 35}}, {"id": 21, "chapter": "l5", "q": {"ru": "Какое поле IPv6 выполняет роль, аналогичную IPv4 TTL?", "en": "Which IPv6 field serves a role similar to IPv4 TTL?"}, "options": [{"ru": "Hop Limit", "en": "Hop Limit"}, {"ru": "Flow Label", "en": "Flow Label"}, {"ru": "Next Header", "en": "Next Header"}, {"ru": "Payload Length", "en": "Payload Length"}], "correct": [0], "explanation": {"ru": "Hop Limit ограничивает число переходов, как TTL в IPv4. Next Header обозначает следующий заголовок/протокол.", "en": "Hop Limit restricts hop count, like IPv4 TTL. Next Header identifies the following header or protocol."}, "source": {"lecture": 5, "page": 25}}, {"id": 22, "chapter": "l5", "q": {"ru": "Что означает код C в выводе Cisco show ip route?", "en": "What does code C mean in Cisco show ip route output?"}, "options": [{"ru": "Маршрут, полученный через OSPF", "en": "A route learned through OSPF"}, {"ru": "Статический маршрут", "en": "A static route"}, {"ru": "Собственный адрес интерфейса /32", "en": "The router’s own /32 interface address"}, {"ru": "Непосредственно подключённая сеть", "en": "A directly connected network"}], "correct": [3], "explanation": {"ru": "C обозначает connected network. L — собственный адрес интерфейса, S — статический, O — OSPF.", "en": "C means a connected network. L is the local interface address, S is static and O is OSPF."}, "source": {"lecture": 5, "page": 43}}, {"id": 23, "chapter": "l5", "q": {"ru": "Какие команды в режиме настройки интерфейса задают IPv4-адрес и административно включают интерфейс?", "en": "Which interface-configuration commands assign an IPv4 address and administratively enable the interface?"}, "options": [{"ru": "ip address 192.168.10.1 255.255.255.0", "en": "ip address 192.168.10.1 255.255.255.0"}, {"ru": "show ip interface brief", "en": "show ip interface brief"}, {"ru": "copy running-config startup-config", "en": "copy running-config startup-config"}, {"ru": "no shutdown", "en": "no shutdown"}], "correct": [0, 3], "explanation": {"ru": "ip address задаёт адрес и маску. no shutdown снимает административное отключение. show проверяет состояние; copy сохраняет конфигурацию.", "en": "ip address assigns address and mask. no shutdown removes administrative shutdown. show verifies state; copy saves configuration."}, "source": {"lecture": 5, "page": 47}}, {"id": 24, "chapter": "l6", "q": {"ru": "Какой адрес сети у хоста 192.168.10.77/26?", "en": "What is the network address of host 192.168.10.77/26?"}, "options": [{"ru": "192.168.10.0", "en": "192.168.10.0"}, {"ru": "192.168.10.64", "en": "192.168.10.64"}, {"ru": "192.168.10.77", "en": "192.168.10.77"}, {"ru": "192.168.10.128", "en": "192.168.10.128"}], "correct": [1], "explanation": {"ru": "Шаг /26 — 64. Число 77 входит в диапазон 64–127, поэтому адрес сети — .64, broadcast — .127.", "en": "A /26 block contains 64 addresses. 77 lies in 64–127, so the network is .64 and broadcast is .127."}, "source": {"lecture": 6, "page": 49}}, {"id": 25, "chapter": "l6", "q": {"ru": "Сколько обычных usable host-адресов в подсети /27?", "en": "How many ordinary usable host addresses are available in a /27 subnet?"}, "options": [{"ru": "32", "en": "32"}, {"ru": "62", "en": "62"}, {"ru": "30", "en": "30"}, {"ru": "14", "en": "14"}], "correct": [2], "explanation": {"ru": "Остаётся 32 − 27 = 5 хостовых битов. 2^5 = 32 адреса; минус сеть и broadcast = 30.", "en": "There are 32 − 27 = 5 host bits. 2^5 = 32 addresses; subtract network and broadcast to obtain 30."}, "source": {"lecture": 6, "page": 49}}, {"id": 26, "chapter": "l6", "q": {"ru": "Какой адрес входит в частный диапазон RFC 1918?", "en": "Which address belongs to an RFC 1918 private range?"}, "options": [{"ru": "172.31.8.10", "en": "172.31.8.10"}, {"ru": "172.32.8.10", "en": "172.32.8.10"}, {"ru": "192.169.1.10", "en": "192.169.1.10"}, {"ru": "11.0.0.10", "en": "11.0.0.10"}], "correct": [0], "explanation": {"ru": "Частный блок 172.16.0.0/12 включает вторые октеты 16–31. 172.32.8.10 уже за его пределами.", "en": "The private 172.16.0.0/12 block includes second octets 16–31. 172.32.8.10 is outside it."}, "source": {"lecture": 6, "page": 36}}, {"id": 27, "chapter": "l6", "q": {"ru": "С какой подсети рекомендуется начинать распределение адресов при VLSM?", "en": "Which subnet should be allocated first when using VLSM?"}, "options": [{"ru": "С подсети с самым длинным префиксом независимо от требований", "en": "The longest-prefix subnet regardless of requirements"}, {"ru": "Всегда с point-to-point /30", "en": "Always a point-to-point /30"}, {"ru": "С любой: порядок никогда не влияет на размещение", "en": "Any subnet: order never affects allocation"}, {"ru": "С подсети, которой нужно больше всего хостов", "en": "The subnet requiring the largest number of hosts"}], "correct": [3], "explanation": {"ru": "VLSM начинают с крупнейшего требования, затем размещают меньшие подсети в оставшемся пространстве, проверяя границы и отсутствие пересечений.", "en": "Allocate the largest requirement first, then fit smaller subnets into the remaining space while checking boundaries and overlaps."}, "source": {"lecture": 6, "page": 57}}, {"id": 28, "chapter": "l7", "q": {"ru": "Какое корректное сокращение соответствует адресу 2001:0db8:0000:1111:0000:0000:0000:0200?", "en": "Which valid abbreviation represents 2001:0db8:0000:1111:0000:0000:0000:0200?"}, "options": [{"ru": "2001:db8::1111::200", "en": "2001:db8::1111::200"}, {"ru": "2001:db8:0:1111::200", "en": "2001:db8:0:1111::200"}, {"ru": "2001:db8:0:1111::2", "en": "2001:db8:0:1111::2"}, {"ru": "2001:db8:1111::200", "en": "2001:db8:1111::200"}], "correct": [1], "explanation": {"ru": "Ведущие нули удаляются, а три последовательные нулевые группы заменяются одним ::. Группа 0200 сокращается до 200, не до 2; нулевая группа перед 1111 сохраняется.", "en": "Remove leading zeros and replace three consecutive zero groups with one ::. The group 0200 becomes 200, not 2; the zero group before 1111 remains."}, "source": {"lecture": 7, "page": 15}}, {"id": 29, "chapter": "l7", "q": {"ru": "Хост отправляет пакет с адресом назначения fe80::2. Каково ограничение этого адреса?", "en": "A host sends a packet to fe80::2. What restriction applies to this address?"}, "options": [{"ru": "Он предназначен только для broadcast.", "en": "It is reserved for broadcast."}, {"ru": "Он всегда маршрутизируется в интернете.", "en": "It is always routed on the internet."}, {"ru": "Он действует только на локальном канале.", "en": "It is valid only on the local link."}, {"ru": "Он является адресом loopback.", "en": "It is the loopback address."}], "correct": [2], "explanation": {"ru": "fe80::/10 — диапазон link-local. Такие адреса используются на одном канале и не маршрутизируются между сетями. IPv6 loopback — ::1.", "en": "fe80::/10 is the link-local range. These addresses are used on one link and are not routed between networks. IPv6 loopback is ::1."}, "source": {"lecture": 7, "page": 23}}, {"id": 30, "chapter": "l7", "q": {"ru": "Организация делит префикс IPv6 /48 на подсети /64. Сколько подсетей она получит?", "en": "An organization divides an IPv6 /48 prefix into /64 subnets. How many subnets are available?"}, "options": [{"ru": "256", "en": "256"}, {"ru": "4096", "en": "4096"}, {"ru": "65 536", "en": "65,536"}, {"ru": "2⁶⁴", "en": "2⁶⁴"}], "correct": [2], "explanation": {"ru": "На Subnet ID остаётся 64 − 48 = 16 бит, поэтому количество /64-подсетей равно 2¹⁶ = 65 536. 64 оставшихся бита относятся к Interface ID.", "en": "The Subnet ID has 64 − 48 = 16 bits, so there are 2¹⁶ = 65,536 /64 subnets. The remaining 64 bits form the Interface ID."}, "source": {"lecture": 7, "page": 46}}, {"id": 31, "chapter": "l7", "q": {"ru": "Какие утверждения о SLAAC со stateless DHCPv6 верны?", "en": "Which statements about SLAAC with stateless DHCPv6 are correct?"}, "options": [{"ru": "Хост сам формирует свой GUA на основе префикса из RA.", "en": "The host constructs its GUA using the RA prefix."}, {"ru": "Сервер DHCPv6 выдаёт шлюз по умолчанию.", "en": "The DHCPv6 server supplies the default gateway."}, {"ru": "Stateless DHCPv6 может сообщить адрес DNS-сервера.", "en": "Stateless DHCPv6 can supply a DNS server address."}, {"ru": "Хост использует ARP для поиска IPv6-маршрутизатора.", "en": "The host uses ARP to discover the IPv6 router."}, {"ru": "Хосту не нужны сообщения RA.", "en": "The host does not need RA messages."}], "correct": [0, 2], "explanation": {"ru": "SLAAC формирует адрес, а stateless DHCPv6 даёт дополнительные параметры, например DNS. Шлюз определяется по маршрутизатору, отправившему RA; ARP относится к IPv4.", "en": "SLAAC constructs the address, while stateless DHCPv6 supplies additional settings such as DNS. The RA-sending router supplies the gateway; ARP is associated with IPv4."}, "source": {"lecture": 7, "page": 35}}, {"id": 32, "chapter": "l7", "q": {"ru": "Какая пара правильно описывает механизм traceroute?", "en": "Which pair correctly describes how traceroute works?"}, "options": [{"ru": "Увеличение TTL/Hop Limit и ответы ICMP Time Exceeded.", "en": "Increasing TTL/Hop Limit and ICMP Time Exceeded responses."}, {"ru": "Запрос DNS MX и ответ SMTP.", "en": "A DNS MX query and an SMTP response."}, {"ru": "Широковещательная рассылка IPv6 и DHCPACK.", "en": "IPv6 broadcast and DHCPACK."}, {"ru": "Одинаковый TTL во всех пробах и только Echo Reply.", "en": "The same TTL in every probe and only Echo Reply responses."}], "correct": [0], "explanation": {"ru": "Traceroute начинает с TTL/Hop Limit 1 и увеличивает его. По мере истечения срока жизни пакетов отвечающие маршрутизаторы сообщают Time Exceeded, раскрывая путь.", "en": "Traceroute starts with TTL/Hop Limit 1 and increases it. As probes expire, responding routers return Time Exceeded messages, revealing the path."}, "source": {"lecture": 7, "page": 66}}, {"id": 33, "chapter": "l8", "q": {"ru": "Какой порядок сообщений устанавливает обычное TCP-соединение?", "en": "Which message order establishes a normal TCP connection?"}, "options": [{"ru": "ACK → SYN → FIN", "en": "ACK → SYN → FIN"}, {"ru": "SYN → ACK → SYN", "en": "SYN → ACK → SYN"}, {"ru": "FIN → SYN-ACK → ACK", "en": "FIN → SYN-ACK → ACK"}, {"ru": "SYN → SYN-ACK → ACK", "en": "SYN → SYN-ACK → ACK"}], "correct": [3], "explanation": {"ru": "Клиент отправляет SYN, сервер отвечает SYN-ACK, клиент подтверждает ACK. FIN используется для завершения направления соединения.", "en": "The client sends SYN, the server responds with SYN-ACK, and the client acknowledges with ACK. FIN is used to close a connection direction."}, "source": {"lecture": 8, "page": 29}}, {"id": 34, "chapter": "l8", "q": {"ru": "Получатель принял подряд 500 байт TCP-данных, начиная с Sequence Number 1000. Какой ACK Number ожидается, если пропусков нет?", "en": "A receiver accepts 500 consecutive TCP data bytes beginning at Sequence Number 1000. What ACK Number is expected if no bytes are missing?"}, "options": [{"ru": "499", "en": "499"}, {"ru": "1000", "en": "1000"}, {"ru": "1499", "en": "1499"}, {"ru": "1500", "en": "1500"}], "correct": [3], "explanation": {"ru": "ACK указывает следующий ожидаемый байт. Приняты байты 1000–1499, поэтому следующий — 1500. Здесь речь о данных, без SYN/FIN.", "en": "ACK identifies the next expected byte. Bytes 1000–1499 were received, so the next byte is 1500. This example contains data only, without SYN/FIN."}, "source": {"lecture": 8, "page": 14}}, {"id": 35, "chapter": "l8", "q": {"ru": "MTU равен 1500 байт; IPv4- и TCP-заголовки без опций занимают по 20 байт. Каков MSS?", "en": "The MTU is 1500 bytes; the IPv4 and TCP headers are 20 bytes each without options. What is the MSS?"}, "options": [{"ru": "1460 байт", "en": "1460 bytes"}, {"ru": "1480 байт", "en": "1480 bytes"}, {"ru": "1500 байт", "en": "1500 bytes"}, {"ru": "1540 байт", "en": "1540 bytes"}], "correct": [0], "explanation": {"ru": "MSS содержит только данные TCP: 1500 − 20 − 20 = 1460 байт. Это не размер окна и не полный размер Ethernet-кадра.", "en": "MSS includes only TCP payload: 1500 − 20 − 20 = 1460 bytes. It is neither the window size nor the full Ethernet frame size."}, "source": {"lecture": 8, "page": 38}}, {"id": 36, "chapter": "l8", "q": {"ru": "Какое свойство принадлежит UDP?", "en": "Which property belongs to UDP?"}, "options": [{"ru": "Он восстанавливает порядок сегментов по Sequence Number.", "en": "It restores segment order using Sequence Numbers."}, {"ru": "Он устанавливает соединение из трёх сообщений.", "en": "It establishes a connection with three messages."}, {"ru": "Он использует 8-байтный заголовок и не выполняет свои повторы передачи.", "en": "It uses an 8-byte header and performs no retransmissions of its own."}, {"ru": "Он объявляет окно получателя для управления потоком.", "en": "It advertises a receiver window for flow control."}], "correct": [2], "explanation": {"ru": "UDP имеет четыре поля по 16 бит, всего 8 байт. Нумерация потока, handshake, окно и повторная передача — механизмы TCP, а не UDP.", "en": "UDP has four 16-bit fields, totaling 8 bytes. Stream sequence numbers, handshake, window and retransmission are TCP mechanisms, not UDP mechanisms."}, "source": {"lecture": 8, "page": 18}}, {"id": 37, "chapter": "l9", "q": {"ru": "Какой уровень OSI отвечает за форматирование, сжатие и шифрование данных?", "en": "Which OSI layer handles data formatting, compression and encryption?"}, "options": [{"ru": "Сетевой", "en": "Network"}, {"ru": "Представления", "en": "Presentation"}, {"ru": "Канальный", "en": "Data Link"}, {"ru": "Транспортный", "en": "Transport"}], "correct": [1], "explanation": {"ru": "Это три основные функции Presentation layer. TCP/IP объединяет функции Application, Presentation и Session в свой прикладной уровень.", "en": "These are the three primary Presentation-layer functions. TCP/IP groups Application, Presentation and Session functions into its application layer."}, "source": {"lecture": 9, "page": 7}}, {"id": 38, "chapter": "l9", "q": {"ru": "Нужно сохранять письма на сервере и синхронизировать состояние ящика между устройствами. Какой протокол подходит лучше всего?", "en": "Messages must remain on the server and mailbox state must synchronize across devices. Which protocol fits best?"}, "options": [{"ru": "SMTP", "en": "SMTP"}, {"ru": "DHCP", "en": "DHCP"}, {"ru": "POP3", "en": "POP3"}, {"ru": "IMAP", "en": "IMAP"}], "correct": [3], "explanation": {"ru": "IMAP работает с серверным ящиком и синхронизирует письма, папки и состояние сообщений. POP3 ориентирован на получение писем и не обеспечивает такую синхронизацию, даже если сохраняет копии на сервере. SMTP отправляет почту; DHCP выдаёт сетевые настройки.", "en": "IMAP works with a server mailbox and synchronizes messages, folders and message state. POP3 retrieves mail and does not provide this synchronization, even when copies remain on the server. SMTP sends mail; DHCP supplies network configuration."}, "source": {"lecture": 9, "page": 30}}, {"id": 39, "chapter": "l9", "q": {"ru": "Какие соответствия типов DNS-записей верны?", "en": "Which DNS record-type mappings are correct?"}, "options": [{"ru": "A — IPv4-адрес", "en": "A — IPv4 address"}, {"ru": "AAAA — почтовый обменник", "en": "AAAA — mail exchanger"}, {"ru": "MX — почтовый обменник", "en": "MX — mail exchanger"}, {"ru": "NS — маска подсети клиента", "en": "NS — client subnet mask"}, {"ru": "A — IPv6-адрес", "en": "A — IPv6 address"}], "correct": [0, 2], "explanation": {"ru": "A хранит IPv4-адрес, AAAA — IPv6-адрес, MX указывает почтовый обменник, NS — авторитетный сервер имён. Маска подсети не является назначением этих DNS-записей.", "en": "A stores an IPv4 address, AAAA an IPv6 address, MX identifies a mail exchanger, and NS an authoritative name server. These DNS records do not assign subnet masks."}, "source": {"lecture": 9, "page": 38}}, {"id": 40, "chapter": "l9", "q": {"ru": "Каков обычный порядок начального получения IPv4-адреса по DHCP?", "en": "What is the usual order for initially obtaining an IPv4 address through DHCP?"}, "options": [{"ru": "Discover → Request → Offer → ACK", "en": "Discover → Request → Offer → ACK"}, {"ru": "Offer → Discover → ACK → Request", "en": "Offer → Discover → ACK → Request"}, {"ru": "Discover → Offer → Request → ACK", "en": "Discover → Offer → Request → ACK"}, {"ru": "Request → ACK → Discover → Offer", "en": "Request → ACK → Discover → Offer"}], "correct": [2], "explanation": {"ru": "DORA: клиент ищет сервер, сервер предлагает аренду, клиент выбирает предложение, сервер подтверждает. UDP 67 — сервер, UDP 68 — клиент.", "en": "DORA: the client discovers servers, a server offers a lease, the client requests the chosen offer, and the server acknowledges. UDP 67 is the server port; UDP 68 is the client port."}, "source": {"lecture": 9, "page": 44}}], "cheat": {"cards": [{"title": {"ru": "Модели, уровни и PDU", "en": "Models, layers and PDUs"}, "wide": true, "html": {"ru": "<table><thead><tr><th>OSI<\/th><th>Главная задача<\/th><th>TCP/IP<\/th><\/tr><\/thead><tbody><tr><td>7 Application<\/td><td>Сетевые службы приложений<\/td><td rowspan=\"3\">Application<\/td><\/tr><tr><td>6 Presentation<\/td><td>Формат, сжатие, шифрование<\/td><\/tr><tr><td>5 Session<\/td><td>Диалоги приложений<\/td><\/tr><tr><td>4 Transport<\/td><td>Порты, передача между приложениями<\/td><td>Transport<\/td><\/tr><tr><td>3 Network<\/td><td>IP и маршрутизация<\/td><td>Internet<\/td><\/tr><tr><td>2 Data Link<\/td><td>Кадры и доступ к среде<\/td><td rowspan=\"2\">Network Access<\/td><\/tr><tr><td>1 Physical<\/td><td>Биты и сигналы<\/td><\/tr><\/tbody><\/table><p><strong>Вниз по стеку:<\/strong> данные → TCP-сегмент / UDP-датаграмма → IP-пакет → кадр → биты. При получении — обратный порядок. TCP handshake относится к L4, даже если в вопросе используется слово «сеанс». <strong>IP — конечный адресат; MAC — следующий узел на локальном канале; порт — приложение.<\/strong><\/p>", "en": "<table><thead><tr><th>OSI<\/th><th>Main responsibility<\/th><th>TCP/IP<\/th><\/tr><\/thead><tbody><tr><td>7 Application<\/td><td>Application network services<\/td><td rowspan=\"3\">Application<\/td><\/tr><tr><td>6 Presentation<\/td><td>Format, compression, encryption<\/td><\/tr><tr><td>5 Session<\/td><td>Application dialogs<\/td><\/tr><tr><td>4 Transport<\/td><td>Ports, application-to-application delivery<\/td><td>Transport<\/td><\/tr><tr><td>3 Network<\/td><td>IP and routing<\/td><td>Internet<\/td><\/tr><tr><td>2 Data Link<\/td><td>Frames and media access<\/td><td rowspan=\"2\">Network Access<\/td><\/tr><tr><td>1 Physical<\/td><td>Bits and signals<\/td><\/tr><\/tbody><\/table><p><strong>Down the stack:<\/strong> data → TCP segment / UDP datagram → IP packet → frame → bits. Reception reverses the process. The TCP handshake belongs to L4 even if a question uses the word “session”. <strong>IP identifies the final recipient; MAC identifies the next local-link recipient; a port identifies the application.<\/strong><\/p>"}}, {"title": {"ru": "IPv4: подсеть за 30 секунд", "en": "IPv4: subnet in 30 seconds"}, "wide": true, "html": {"ru": "<table><thead><tr><th>Префикс<\/th><th>Маска<\/th><th>Шаг<\/th><th>Узлов<\/th><\/tr><\/thead><tbody><tr><td>/24<\/td><td>255.255.255.0<\/td><td>256<\/td><td>254<\/td><\/tr><tr><td>/25<\/td><td>255.255.255.128<\/td><td>128<\/td><td>126<\/td><\/tr><tr><td>/26<\/td><td>255.255.255.192<\/td><td>64<\/td><td>62<\/td><\/tr><tr><td>/27<\/td><td>255.255.255.224<\/td><td>32<\/td><td>30<\/td><\/tr><tr><td>/28<\/td><td>255.255.255.240<\/td><td>16<\/td><td>14<\/td><\/tr><tr><td>/29<\/td><td>255.255.255.248<\/td><td>8<\/td><td>6<\/td><\/tr><tr><td>/30<\/td><td>255.255.255.252<\/td><td>4<\/td><td>2<\/td><\/tr><\/tbody><\/table><p><code>h = 32 − префикс<\/code>; адресов <code>2^h<\/code>, обычных узлов <code>2^h − 2<\/code>. Шаг в последнем октете = <code>256 − октет маски<\/code>. Сеть = <code>IP AND mask<\/code>.<\/p><p><strong>Пример 192.168.10.77/27:<\/strong> шаг 32; 77 попадает в блок 64–95. Сеть <code>192.168.10.64<\/code>, broadcast <code>192.168.10.95<\/code>, узлы <code>.65–.94<\/code>, всего 30. Формула узлов здесь для обычных подсетей /24–/30.<\/p>", "en": "<table><thead><tr><th>Prefix<\/th><th>Mask<\/th><th>Block<\/th><th>Hosts<\/th><\/tr><\/thead><tbody><tr><td>/24<\/td><td>255.255.255.0<\/td><td>256<\/td><td>254<\/td><\/tr><tr><td>/25<\/td><td>255.255.255.128<\/td><td>128<\/td><td>126<\/td><\/tr><tr><td>/26<\/td><td>255.255.255.192<\/td><td>64<\/td><td>62<\/td><\/tr><tr><td>/27<\/td><td>255.255.255.224<\/td><td>32<\/td><td>30<\/td><\/tr><tr><td>/28<\/td><td>255.255.255.240<\/td><td>16<\/td><td>14<\/td><\/tr><tr><td>/29<\/td><td>255.255.255.248<\/td><td>8<\/td><td>6<\/td><\/tr><tr><td>/30<\/td><td>255.255.255.252<\/td><td>4<\/td><td>2<\/td><\/tr><\/tbody><\/table><p><code>h = 32 − prefix<\/code>; total addresses <code>2^h<\/code>, ordinary usable hosts <code>2^h − 2<\/code>. Last-octet block size = <code>256 − mask octet<\/code>. Network = <code>IP AND mask<\/code>.<\/p><p><strong>Example 192.168.10.77/27:<\/strong> block size 32; 77 falls within 64–95. Network <code>192.168.10.64<\/code>, broadcast <code>192.168.10.95<\/code>, hosts <code>.65–.94<\/code>, 30 usable hosts. The host formula here applies to ordinary /24–/30 subnets.<\/p>"}}, {"title": {"ru": "Адреса, которые надо узнать сразу", "en": "Address ranges to recognize"}, "wide": false, "html": {"ru": "<table><thead><tr><th>Диапазон<\/th><th>Назначение<\/th><\/tr><\/thead><tbody><tr><td>10.0.0.0/8<\/td><td>Частный IPv4<\/td><\/tr><tr><td>172.16.0.0/12<\/td><td>Частный: 172.16–172.31<\/td><\/tr><tr><td>192.168.0.0/16<\/td><td>Частный IPv4<\/td><\/tr><tr><td>127.0.0.0/8<\/td><td>Loopback<\/td><\/tr><tr><td>169.254.0.0/16<\/td><td>IPv4 link-local / APIPA<\/td><\/tr><tr><td>224.0.0.0/4<\/td><td>IPv4 multicast<\/td><\/tr><tr><td>fe80::/10<\/td><td>IPv6 link-local<\/td><\/tr><tr><td>fc00::/7<\/td><td>IPv6 unique local<\/td><\/tr><tr><td>2000::/3<\/td><td>GUA в лекции<\/td><\/tr><tr><td>::1<\/td><td>IPv6 loopback<\/td><\/tr><\/tbody><\/table><p>Не каждый <code>172.x<\/code> — частный. IPv6: <strong>128 бит, 8 hextet, обычно /64<\/strong> для LAN, без broadcast. <code>::<\/code> допустимо один раз; ведущие нули можно убрать, конечные — нельзя. LLA не пересылается между сетями.<\/p>", "en": "<table><thead><tr><th>Range<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>10.0.0.0/8<\/td><td>Private IPv4<\/td><\/tr><tr><td>172.16.0.0/12<\/td><td>Private: 172.16–172.31<\/td><\/tr><tr><td>192.168.0.0/16<\/td><td>Private IPv4<\/td><\/tr><tr><td>127.0.0.0/8<\/td><td>Loopback<\/td><\/tr><tr><td>169.254.0.0/16<\/td><td>IPv4 link-local / APIPA<\/td><\/tr><tr><td>224.0.0.0/4<\/td><td>IPv4 multicast<\/td><\/tr><tr><td>fe80::/10<\/td><td>IPv6 link-local<\/td><\/tr><tr><td>fc00::/7<\/td><td>IPv6 unique local<\/td><\/tr><tr><td>2000::/3<\/td><td>GUA range in the lecture<\/td><\/tr><tr><td>::1<\/td><td>IPv6 loopback<\/td><\/tr><\/tbody><\/table><p>Not every <code>172.x<\/code> address is private. IPv6 has <strong>128 bits, 8 hextets, usually /64<\/strong> for LANs, and no broadcast. Use <code>::<\/code> once; remove leading, never trailing, zeros. LLAs are not forwarded between networks.<\/p>"}}, {"title": {"ru": "Порты и назначение протоколов", "en": "Protocol ports and purposes"}, "wide": false, "html": {"ru": "<table><thead><tr><th>Сервис<\/th><th>Транспорт / порт<\/th><\/tr><\/thead><tbody><tr><td>FTP управление / данные*<\/td><td>TCP 21 / 20<\/td><\/tr><tr><td>SSH / Telnet<\/td><td>TCP 22 / 23<\/td><\/tr><tr><td>SMTP<\/td><td>TCP 25<\/td><\/tr><tr><td>DNS<\/td><td>UDP и TCP 53<\/td><\/tr><tr><td>DHCP сервер / клиент<\/td><td>UDP 67 / 68<\/td><\/tr><tr><td>TFTP / SNMP<\/td><td>UDP 69 / 161<\/td><\/tr><tr><td>HTTP / HTTPS**<\/td><td>TCP 80 / 443<\/td><\/tr><tr><td>POP3 / IMAP<\/td><td>TCP 110 / 143<\/td><\/tr><\/tbody><\/table><p>* FTP 20 — данные в классическом активном режиме. ** Базовая модель курса. SMTP отправляет, IMAP синхронизирует почту. DNS: <strong>A = IPv4, AAAA = IPv6, MX = почта, NS = сервер имён<\/strong>. DHCP: <strong>Discover → Offer → Request → ACK<\/strong>. Порты: 0–1023 известные; 1024–49151 зарегистрированные; 49152–65535 динамические.<\/p>", "en": "<table><thead><tr><th>Service<\/th><th>Transport / port<\/th><\/tr><\/thead><tbody><tr><td>FTP control / data*<\/td><td>TCP 21 / 20<\/td><\/tr><tr><td>SSH / Telnet<\/td><td>TCP 22 / 23<\/td><\/tr><tr><td>SMTP<\/td><td>TCP 25<\/td><\/tr><tr><td>DNS<\/td><td>UDP and TCP 53<\/td><\/tr><tr><td>DHCP server / client<\/td><td>UDP 67 / 68<\/t
