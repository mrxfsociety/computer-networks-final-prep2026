d><\/tr><tr><td>TFTP / SNMP<\/td><td>UDP 69 / 161<\/td><\/tr><tr><td>HTTP / HTTPS**<\/td><td>TCP 80 / 443<\/td><\/tr><tr><td>POP3 / IMAP<\/td><td>TCP 110 / 143<\/td><\/tr><\/tbody><\/table><p>* FTP 20 carries data in classic active mode. ** Basic course model. SMTP sends mail; IMAP synchronizes mailboxes. DNS: <strong>A = IPv4, AAAA = IPv6, MX = mail, NS = name server<\/strong>. DHCP: <strong>Discover → Offer → Request → ACK<\/strong>. Ports: 0–1023 well-known; 1024–49151 registered; 49152–65535 dynamic.<\/p>"}}, {"title": {"ru": "TCP и UDP: отличия за минуту", "en": "TCP and UDP in one minute"}, "wide": false, "html": {"ru": "<table><thead><tr><th>Свойство<\/th><th>TCP<\/th><th>UDP<\/th><\/tr><\/thead><tbody><tr><td>Соединение<\/td><td>Есть<\/td><td>Нет<\/td><\/tr><tr><td>Порядок и повторы<\/td><td>Есть<\/td><td>Нет в UDP<\/td><\/tr><tr><td>Управление потоком<\/td><td>Есть<\/td><td>Нет<\/td><\/tr><tr><td>Заголовок<\/td><td>≥20 байт<\/td><td>8 байт<\/td><\/tr><\/tbody><\/table><p><strong>Открытие:<\/strong> SYN → SYN-ACK → ACK.<br><strong>Типичное закрытие:<\/strong> FIN → ACK → FIN → ACK.<\/p><p>ACK = следующий ожидаемый байт: SEQ 1000 + 500 байт → <strong>ACK 1500<\/strong>. Окно защищает получателя; congestion control реагирует на перегрузку сети. <code>MSS = MTU − IP header − TCP header<\/code>: <code>1500 − 20 − 20 = 1460<\/code> без опций. UDP Length = заголовок + данные. <strong>Контрольная сумма не означает повторную передачу.<\/strong><\/p>", "en": "<table><thead><tr><th>Feature<\/th><th>TCP<\/th><th>UDP<\/th><\/tr><\/thead><tbody><tr><td>Connection<\/td><td>Yes<\/td><td>No<\/td><\/tr><tr><td>Ordering and retries<\/td><td>Yes<\/td><td>Not in UDP<\/td><\/tr><tr><td>Flow control<\/td><td>Yes<\/td><td>No<\/td><\/tr><tr><td>Header<\/td><td>≥20 bytes<\/td><td>8 bytes<\/td><\/tr><\/tbody><\/table><p><strong>Setup:<\/strong> SYN → SYN-ACK → ACK.<br><strong>Typical closure:<\/strong> FIN → ACK → FIN → ACK.<\/p><p>ACK = next expected byte: SEQ 1000 + 500 bytes → <strong>ACK 1500<\/strong>. The window protects the receiver; congestion control addresses network overload. <code>MSS = MTU − IP header − TCP header<\/code>: <code>1500 − 20 − 20 = 1460<\/code> without options. UDP Length = header + data. <strong>A checksum does not imply retransmission.<\/strong><\/p>"}}, {"title": {"ru": "IP и MAC на каждом переходе", "en": "IP and MAC at every hop"}, "wide": false, "html": {"ru": "<p>Для обычной маршрутизации <strong>без NAT<\/strong> исходный IP компьютера и конечный IP сервера сохраняются. Маршрутизатор меняет Ethernet-кадр и уменьшает TTL / Hop Limit.<\/p><table><thead><tr><th>Канал<\/th><th>Source MAC<\/th><th>Destination MAC<\/th><\/tr><\/thead><tbody><tr><td>PC → R1<\/td><td>PC<\/td><td>Вход R1<\/td><\/tr><tr><td>R1 → R2<\/td><td>Выход R1<\/td><td>Вход R2<\/td><\/tr><tr><td>R2 → Server<\/td><td>Выход R2<\/td><td>Server<\/td><\/tr><\/tbody><\/table><p>Все каналы здесь — Ethernet. Если цель локальная, MAC назначения принадлежит самой цели; если удалённая — локальному шлюзу. <strong>ARP<\/strong> разрешает IPv4 в MAC; запрос — broadcast. <strong>IPv6 ND<\/strong> использует ICMPv6 NS/NA для адресного разрешения, RS/RA для маршрутизаторов. Для удалённого сервера хост ищет MAC шлюза, а не сервера.<\/p>", "en": "<p>During ordinary routing <strong>without NAT<\/strong>, the original PC's source IP and final server's destination IP remain unchanged. A router replaces the Ethernet frame and decreases TTL / Hop Limit.<\/p><table><thead><tr><th>Link<\/th><th>Source MAC<\/th><th>Destination MAC<\/th><\/tr><\/thead><tbody><tr><td>PC → R1<\/td><td>PC<\/td><td>R1 incoming interface<\/td><\/tr><tr><td>R1 → R2<\/td><td>R1 outgoing interface<\/td><td>R2 incoming interface<\/td><\/tr><tr><td>R2 → Server<\/td><td>R2 outgoing interface<\/td><td>Server<\/td><\/tr><\/tbody><\/table><p>All links here use Ethernet. A local destination receives its own MAC as destination; a remote destination uses the local gateway's MAC. <strong>ARP<\/strong> resolves IPv4 to MAC; its request is broadcast. <strong>IPv6 ND<\/strong> uses ICMPv6 NS/NA for address resolution and RS/RA for router discovery. For a remote server, resolve the gateway's MAC, not the server's.<\/p>"}}]}, "sources": [{"lecture": 1, "id": "libfile_fde3_f-358563fe05ac8191bebaa7b3fffea0ac_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 1.pdf"}, {"lecture": 2, "id": "libfile_fde3_f-3c54ab12110481919e64dc18a8d74b6e_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 2.pdf"}, {"lecture": 3, "id": "libfile_fde3_f-7f238eb24d7c8191b074a16e18c3f5fa_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 3.pdf"}, {"lecture": 4, "id": "libfile_fde3_f-c5672779b7bc8191b80b4154fadd5705_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 4.pdf"}, {"lecture": 5, "id": "libfile_fde3_f-b870c799b2a88191a210b3f57ff9ebb0_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 5.pdf"}, {"lecture": 6, "id": "libfile_fde3_f-1c7ff1b8fb208191a3deb9edfd090520_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 6.pdf"}, {"lecture": 7, "id": "libfile_fde3_f-e6dd05cb174c819191f0a7d1987335d1_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 7.pdf"}, {"lecture": 8, "id": "libfile_fde3_f-9802bc875a388191a0983f665e46386e_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 8.pdf"}, {"lecture": 9, "id": "libfile_fde3_f-b684e6de97908191a3f3903f63b3a8be_e016d5e2e8d88191b843c6df2b927be2", "name": "Lecture 9.pdf"}]};

 const q=qMap[id],ok=isCorrect(id);
 function answerText(arr){return arr.map(function(i){return String.fromCharCode(65+i)+". "+B(q.options[i]);}).join(" · ");}
 return '<article class="review-card '+(ok?"":"wrong")+'"><div class="review-top"><h4>'+num(id)+'. '+esc(B(q.q))+'</h4><span class="review-status">'+(ok?"✓ ":"× ")+T(ok?"correct":"wrong")+'</span></div><div class="review-answer">'+T("yourAnswer")+': <b>'+esc(answerText(state.answers[id]||[]))+'</b><br>'+T("rightAnswer")+': <b>'+esc(answerText(q.correct))+'</b></div><div class="review-explanation">'+esc(B(q.explanation))+'</div><div class="review-foot"><span>'+T("lecture")+' '+q.source.lecture+' · PDF '+T("pages")+' '+q.source.page+'</span><button type="button" class="source-btn" data-chapter="'+q.chapter+'">'+T("backTopic")+'</button></div></article>';
 }).join(""):'<div class="empty-review">'+T("noErrors")+'</div>')+'</div>';
}
function renderSources(){
 document.getElementById("sources").innerHTML='<details class="sources"><summary>'+T("sources")+'</summary><div class="sources-list">'+DATA.chapters.map(function(c){const source=DATA.sources.find(function(s){return s.lecture===c.lecture;});return '<div><a href="https://chatgpt.com/library?file_id='+encodeURIComponent(source.id)+'&amp;account_id=personal" target="_blank" rel="noopener noreferrer">Lecture '+c.lecture+'.pdf ↗</a> · '+T("pages")+' '+c.sourcePages+'</div>';}).join("")+'</div><p class="source-note">'+T("sourcesNote")+'</p></details>';
 document.getElementById("footer").innerHTML='<strong>'+T("footerLeft")+'</strong><span>'+T("footerRight")+'</span>';
}
function renderAll(){
 document.documentElement.lang=state.lang;
 document.getElementById("skipLink").textContent=T("skip");
 renderSidebar();renderTop();renderHero();renderStudy();renderQuick();renderExam();renderSources();
}
function go(id){document.getElementById(id).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});}
function closeMenu(){mobileMenu=false;document.getElementById("sidebar").classList.remove("is-open");document.getElementById("sidebarVeil").classList.remove("is-open");const b=document.getElementById("menuBtn");if(b)b.setAttribute("aria-expanded","false");}
function openChapter(id){
 const d=document.getElementById(id);if(!d)return;d.open=true;
 if(!state.open.includes(id))state.open.push(id);persist();renderSidebar();closeMenu();go(id);
}
function questionFocus(){const legend=document.getElementById("questionTitle");if(legend)legend.focus({preventScroll:true});}
document.addEventListener("change",function(event){
 const input=event.target.closest("input[data-answer]");if(!input||state.submitted)return;
 const id=Number(input.dataset.answer),value=Number(input.value),q=qMap[id];
 if(!q||!state.run.includes(id))return;
 let answers=state.answers[id]||[];
 if(q.correct.length===1)answers=[value];else if(input.checked){if(!answers.includes(value))answers=answers.concat(value);}else answers=answers.filter(function(v){return v!==value;});
 state.answers[id]=answers.sort(function(a,b){return a-b;});feedback="";persist();renderExam();
 const same=document.querySelector('input[data-answer="'+id+'"][value="'+value+'"]');if(same)same.focus({preventScroll:true});
});
document.addEventListener("click",function(event){
 const lang=event.target.closest("[data-lang]");if(lang){
   const y=window.scrollY;state.lang=lang.dataset.lang;feedback="";persist();renderAll();window.scrollTo(0,y);return;
 }
 const complete=event.target.closest("[data-complete]");if(complete){
   const id=complete.dataset.complete;state.completed=state.completed.includes(id)?state.completed.filter(function(v){return v!==id;}):state.completed.concat(id);
   persist();complete.classList.toggle("completed",state.completed.includes(id));complete.textContent=T(state.completed.includes(id)?"done":"mark");complete.setAttribute("aria-pressed",String(state.completed.includes(id)));renderSidebar();return;
 }
 const chapter=event.target.closest("[data-chapter]");if(chapter){openChapter(chapter.dataset.chapter);return;}
 const target=event.target.closest("[data-go]");if(target){closeMenu();go(target.dataset.go);return;}
 if(event.target.closest("#menuBtn")){mobileMenu=!mobileMenu;document.getElementById("sidebar").classList.toggle("is-open",mobileMenu);document.getElementById("sidebarVeil").classList.toggle("is-open",mobileMenu);document.getElementById("menuBtn").setAttribute("aria-expanded",String(mobileMenu));return;}
 if(event.target.closest("#sidebarVeil")){closeMenu();return;}
 const jump=event.target.closest("[data-qjump]");if(jump){state.current=Number(jump.dataset.qjump);feedback="";persist();renderExam();questionFocus();return;}
 if(event.target.closest("[data-next]")){state.current=Math.min(state.current+1,state.run.length-1);feedback="";persist();renderExam();questionFocus();return;}
 if(event.target.closest("[data-prev]")){state.current=Math.max(0,state.current-1);feedback="";persist();renderExam();questionFocus();return;}
 if(event.target.closest("[data-last]")){document.getElementById("finishButton").focus();document.getElementById("finishButton").scrollIntoView({block:"center",behavior:"smooth"});return;}
 if(event.target.closest("[data-finish]")){
   const incomplete=state.run.filter(function(id){return !validAnswer(id);});
   if(incomplete.length){state.current=state.run.indexOf(incomplete[0]);feedback=T("feedback",{n:incomplete.length});persist();renderExam();questionFocus();go("exam");return;}
   state.submitted=true;errorsOnly=false;feedback="";persist();renderExam();go("exam");return;
 }
 if(event.target.closest("[data-filter]")){errorsOnly=!errorsOnly;renderResults();return;}
 if(event.target.closest("[data-retry]")){
   const missed=state.run.filter(function(id){return !isCorrect(id);});if(!missed.length)return;
   state.run=missed;missed.forEach(function(id){delete state.answers[id];});state.current=0;state.submitted=false;errorsOnly=false;feedback="";persist();renderExam();go("exam");return;
 }
 if(event.target.closest("[data-restart]")){state.run=fullIds.slice();state.answers={};state.current=0;state.submitted=false;errorsOnly=false;feedback="";persist();renderExam();go("exam");return;}
});
document.addEventListener("keydown",function(event){if(event.key==="Escape")closeMenu();});
renderAll();persist();
</script>
</body>
</html>
