<script>
"use strict";
const DATA = {"chapters": [{"id": "l1", "lecture": 1, "title": {"ru": "Основы сетей и Cisco IOS", "en": "Network foundations and Cisco IOS"}, "summary": {"ru": "Кто передаёт данные, как устроены сети и как читать команды Cisco. Главный практический навык: различать режимы IOS и сохранять конфигурацию.", "en": "Who sends data, how networks are organized, and how to read Cisco commands. The key practical skill is recognizing IOS modes and saving configuration."}, "sourcePages": "1–84", "sections": [{"heading": {"ru": "1. Устройства, среда и топология", "en": "1. Devices, media, and topology"}, "html": {"ru": "<p><strong>Конечное устройство (end device / host)<\/strong> создаёт или получает сообщение: компьютер, сервер, телефон. Клиент запрашивает услугу, сервер её предоставляет. В <strong>peer-to-peer<\/strong> одно устройство может выполнять обе роли. Такая сеть проста и недорога, но плохо масштабируется и не имеет централизованного администрирования.<\/p><p><strong>Промежуточные устройства<\/strong> соединяют хосты и управляют движением данных: коммутатор, маршрутизатор, точка доступа, межсетевой экран. NIC — сетевой адаптер; порт или интерфейс — место подключения.<\/p><table><thead><tr><th>Среда<\/th><th>Представление данных<\/th><\/tr><\/thead><tbody><tr><td>Медный кабель<\/td><td>Электрические сигналы<\/td><\/tr><tr><td>Оптоволокно<\/td><td>Импульсы света<\/td><\/tr><tr><td>Беспроводная связь<\/td><td>Электромагнитные волны<\/td><\/tr><\/tbody><\/table><p><strong>Физическая топология<\/strong> показывает расположение оборудования и кабелей. <strong>Логическая<\/strong> — соединения устройств, интерфейсы и адресацию. В вопросе про расположение кабеля выбирай physical; про IP-адреса — logical. Источник: с. 8–15.<\/p>", "en": "<p>An <strong>end device (host)<\/strong> originates or receives a message: a computer, server, or phone. A client requests a service; a server provides it. In a <strong>peer-to-peer<\/strong> network, one device may perform both roles. This design is simple and inexpensive, but has limited scalability and no centralized administration.<\/p><p><strong>Intermediary devices<\/strong> connect hosts and manage data movement: switches, routers, access points, and firewalls. A NIC is a network interface card; a port or interface provides a connection point.<\/p><table><thead><tr><th>Medium<\/th><th>Data representation<\/th><\/tr><\/thead><tbody><tr><td>Copper cable<\/td><td>Electrical signals<\/td><\/tr><tr><td>Optical fiber<\/td><td>Light pulses<\/td><\/tr><tr><td>Wireless<\/td><td>Electromagnetic waves<\/td><\/tr><\/tbody><\/table><p>A <strong>physical topology<\/strong> shows device locations and cable installation. A <strong>logical topology<\/strong> shows device connections, interfaces, and addressing. A question about cable location points to physical topology; one about IP addressing points to logical topology. Source: pp. 8–15.<\/p>"}}, {"heading": {"ru": "2. LAN, WAN и доступ в интернет", "en": "2. LAN, WAN, and Internet access"}, "html": {"ru": "<p><strong>LAN<\/strong> объединяет устройства на небольшой территории и обычно управляется одной организацией. <strong>WAN<\/strong> соединяет LAN на больших расстояниях; её соединения часто предоставляют операторы. Интернет — глобальное объединение сетей.<\/p><p><strong>Intranet<\/strong> — внутренняя сеть организации для разрешённых пользователей. <strong>Extranet<\/strong> предоставляет ограниченный доступ внешним партнёрам. Это различие про аудиторию доступа, а не размер сети.<\/p><ul><li><strong>Cable<\/strong>: доступ через инфраструктуру кабельного телевидения.<\/li><li><strong>DSL<\/strong>: широкополосный доступ по телефонной линии.<\/li><li><strong>Cellular<\/strong>: мобильная сеть; satellite полезен в удалённых местах.<\/li><li><strong>Leased line<\/strong>: выделенный канал для организации; Ethernet WAN переносит Ethernet-связность на большие расстояния.<\/li><\/ul><p><strong>Конвергентная сеть<\/strong> передаёт голос, видео и данные по общей инфраструктуре. Источник: с. 22–31.<\/p>", "en": "<p>A <strong>LAN<\/strong> connects devices within a limited area and is usually administered by one organization. A <strong>WAN<\/strong> connects LANs across large distances; service providers commonly operate its links. The Internet is a worldwide collection of interconnected networks.<\/p><p>An <strong>intranet<\/strong> is an organization's internal network for authorized users. An <strong>extranet<\/strong> gives selected external partners access. This distinction concerns access and audience, rather than network size.<\/p><ul><li><strong>Cable<\/strong>: access through cable television infrastructure.<\/li><li><strong>DSL<\/strong>: broadband over a telephone line.<\/li><li><strong>Cellular<\/strong>: a mobile network; satellite helps serve remote locations.<\/li><li><strong>Leased line<\/strong>: a dedicated organizational circuit; Ethernet WAN extends Ethernet connectivity across larger distances.<\/li><\/ul><p>A <strong>converged network<\/strong> carries voice, video, and data over shared infrastructure. Source: pp. 22–31.<\/p>"}}, {"heading": {"ru": "3. Надёжность и безопасность", "en": "3. Reliability and security"}, "html": {"ru": "<table><thead><tr><th>Характеристика<\/th><th>Что искать в вопросе<\/th><\/tr><\/thead><tbody><tr><td>Fault tolerance — отказоустойчивость<\/td><td>Резервные пути; ограничение последствий отказа<\/td><\/tr><tr><td>Scalability — масштабируемость<\/td><td>Добавление пользователей и сервисов без ухудшения существующих<\/td><\/tr><tr><td>QoS — качество обслуживания<\/td><td>Управление очередями и приоритетами, особенно для голоса и видео<\/td><\/tr><tr><td>Security — безопасность<\/td><td>Защита инфраструктуры и информации<\/td><\/tr><\/tbody><\/table><p>При <strong>packet switching<\/strong> сообщение делится на пакеты; резервные пути повышают устойчивость. <strong>Circuit switching<\/strong> использует установленный выделенный канал.<\/p><p>Три цели безопасности, <strong>CIA<\/strong>: confidentiality — данные доступны только разрешённым получателям; integrity — данные не изменены несанкционированно; availability — разрешённые пользователи получают своевременный доступ. «Нельзя прочитать» — confidentiality, «нельзя незаметно изменить» — integrity, «сервис работает» — availability. Источник: с. 33–37.<\/p>", "en": "<table><thead><tr><th>Characteristic<\/th><th>Clues in a question<\/th><\/tr><\/thead><tbody><tr><td>Fault tolerance<\/td><td>Redundant paths; limiting the impact of a failure<\/td><\/tr><tr><td>Scalability<\/td><td>Adding users and services without harming existing ones<\/td><\/tr><tr><td>Quality of Service (QoS)<\/td><td>Managing queues and priorities, especially for voice and video<\/td><\/tr><tr><td>Security<\/td><td>Protecting infrastructure and information<\/td><\/tr><\/tbody><\/table><p>With <strong>packet switching<\/strong>, messages are split into packets; alternative paths support resilience. <strong>Circuit switching<\/strong> uses an established dedicated circuit.<\/p><p>The three security goals form <strong>CIA<\/strong>: confidentiality means only authorized recipients can read data; integrity means data has not been altered without authorization; availability means authorized users receive timely access. “Cannot read it” points to confidentiality, “cannot secretly change it” to integrity, and “the service is accessible” to availability. Source: pp. 33–37.<\/p>"}}, {"heading": {"ru": "4. BYOD, облака и домашние технологии", "en": "4. BYOD, clouds, and home technologies"}, "html": {"ru": "<p><strong>BYOD<\/strong> позволяет использовать собственные устройства для работы с сетью. Онлайн-сотрудничество и видеосвязь помогают работать совместно; облачные сервисы предоставляют приложения, вычисления и хранение через сеть.<\/p><ul><li><strong>Public cloud<\/strong>: сервис доступен широкой аудитории.<\/li><li><strong>Private cloud<\/strong>: предназначен для конкретной организации.<\/li><li><strong>Hybrid cloud<\/strong>: объединяет разные типы облаков.<\/li><li><strong>Custom cloud<\/strong>: термин лекции для облака под нужды конкретной отрасли.<\/li><\/ul><p><strong>Powerline<\/strong> использует существующую электропроводку для передачи данных с помощью адаптеров. <strong>WISP<\/strong> подключает абонентов к точкам беспроводного доступа оператора. Источник: с. 39–47.<\/p>", "en": "<p><strong>BYOD<\/strong> lets people use their own devices to access network resources. Online collaboration and video communication support joint work; cloud services provide applications, computing, and storage over a network.<\/p><ul><li><strong>Public cloud<\/strong>: available to the general public.<\/li><li><strong>Private cloud<\/strong>: intended for a specific organization.<\/li><li><strong>Hybrid cloud<\/strong>: combines different cloud types.<\/li><li><strong>Custom cloud<\/strong>: the lecture's term for a cloud tailored to a particular industry.<\/li><\/ul><p><strong>Powerline<\/strong> carries data over existing electrical wiring using adapters. A <strong>WISP<\/strong> connects subscribers to a provider's wireless access points. Source: pp. 39–47.<\/p>"}}, {"heading": {"ru": "5. Способы доступа к IOS", "en": "5. Accessing IOS"}, "html": {"ru": "<p><strong>Shell<\/strong> предоставляет пользовательский интерфейс; <strong>kernel<\/strong> управляет взаимодействием программ с оборудованием. CLI использует текстовые команды, GUI — окна и меню.<\/p><table><thead><tr><th>Способ<\/th><th>Назначение<\/th><\/tr><\/thead><tbody><tr><td>Console<\/td><td>Физический порт управления; начальная настройка<\/td><\/tr><tr><td>SSH<\/td><td>Защищённая удалённая CLI-сессия по сети<\/td><\/tr><tr><td>Telnet<\/td><td>Удалённая CLI-сессия без шифрования; пароли и команды идут открытым текстом<\/td><\/tr><\/tbody><\/table><p>Если требуется <strong>secure remote management<\/strong>, выбирай SSH. Наличие пароля у Telnet не делает соединение зашифрованным. Источник: с. 51–56.<\/p>", "en": "<p>The <strong>shell<\/strong> provides the user interface; the <strong>kernel<\/strong> manages interaction between software and hardware. A CLI uses text commands, while a GUI uses windows and menus.<\/p><table><thead><tr><th>Method<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Console<\/td><td>Physical management port; initial configuration<\/td><\/tr><tr><td>SSH<\/td><td>Secure remote CLI session over a network<\/td><\/tr><tr><td>Telnet<\/td><td>Unencrypted remote CLI session; passwords and commands travel in plaintext<\/td><\/tr><\/tbody><\/table><p>If a question asks for <strong>secure remote management<\/strong>, choose SSH. A Telnet password does not make the connection encrypted. Source: pp. 51–56.<\/p>"}}, {"heading": {"ru": "6. Режимы IOS: смотри на приглашение", "en": "6. IOS modes: read the prompt"}, "html": {"ru": "<table><thead><tr><th>Приглашение<\/th><th>Режим<\/th><th>Как войти<\/th><\/tr><\/thead><tbody><tr><td><code>Switch&gt;<\/code><\/td><td>User EXEC<\/td><td>Начальный ограниченный режим<\/td><\/tr><tr><td><code>Switch#<\/code><\/td><td>Privileged EXEC<\/td><td><code>enable<\/code><\/td><\/tr><tr><td><code>Switch(config)#<\/code><\/td><td>Global configuration<\/td><td><code>configure terminal<\/code><\/td><\/tr><tr><td><code>Switch(config-line)#<\/code><\/td><td>Настройка линии<\/td><td><code>line console 0<\/code><\/td><\/tr><tr><td><code>Switch(config-if)#<\/code><\/td><td>Настройка интерфейса<\/td><td><code>interface ...<\/code><\/td><\/tr><\/tbody><\/table><p><code>exit<\/code> возвращает на один уровень. <code>end<\/code> или Ctrl+Z возвращает из режима настройки в privileged EXEC. Символ <code>#<\/code> встречается и в конфигурационных режимах: проверяй весь prompt. Источник: с. 58–61.<\/p>", "en": "<table><thead><tr><th>Prompt<\/th><th>Mode<\/th><th>How to enter<\/th><\/tr><\/thead><tbody><tr><td><code>Switch&gt;<\/code><\/td><td>User EXEC<\/td><td>Initial limited mode<\/td><\/tr><tr><td><code>Switch#<\/code><\/td><td>Privileged EXEC<\/td><td><code>enable<\/code><\/td><\/tr><tr><td><code>Switch(config)#<\/code><\/td><td>Global configuration<\/td><td><code>configure terminal<\/code><\/td><\/tr><tr><td><code>Switch(config-line)#<\/code><\/td><td>Line configuration<\/td><td><code>line console 0<\/code><\/td><\/tr><tr><td><code>Switch(config-if)#<\/code><\/td><td>Interface configuration<\/td><td><code>interface ...<\/code><\/td><\/tr><\/tbody><\/table><p><code>exit<\/code> moves back one level. <code>end<\/code> or Ctrl+Z returns from configuration to privileged EXEC. Configuration prompts also contain <code>#<\/code>, so inspect the entire prompt. Source: pp. 58–61.<\/p>"}}, {"heading": {"ru": "7. Синтаксис и быстрые клавиши", "en": "7. Syntax and shortcuts"}, "html": {"ru": "<p><strong>Keyword<\/strong> — заданное системой слово; <strong>argument<\/strong> — значение пользователя. В <code>ping 10.10.10.5<\/code> адрес — аргумент. В документации квадратные скобки <code>[ ]<\/code> обозначают необязательную часть, фигурные <code>{ }<\/code> — обязательную.<\/p><ul><li><code>?<\/code> вызывает контекстную справку, Tab дополняет команду.<\/li><li>Сокращение допустимо, если однозначно: <code>conf<\/code> для <code>configure<\/code>.<\/li><li>Стрелка вверх возвращает предыдущую команду.<\/li><li>При <code>--More--<\/code>: Enter — следующая строка, пробел — следующий экран.<\/li><li>Ctrl+Shift+6 прерывает операции вроде ping или traceroute.<\/li><\/ul><p>Ошибка синтаксиса часто означает неверный режим, неоднозначное сокращение или отсутствующий аргумент. Источник: с. 63–70.<\/p>", "en": "<p>A <strong>keyword<\/strong> is defined by the system; an <strong>argument<\/strong> is a user-supplied value. In <code>ping 10.10.10.5<\/code>, the address is an argument. In documentation, square brackets <code>[ ]<\/code> indicate an optional element, while braces <code>{ }<\/code> indicate a required element.<\/p><ul><li><code>?<\/code> opens context-sensitive help; Tab completes a command.<\/li><li>Abbreviations are valid when unambiguous: <code>conf<\/code> for <code>configure<\/code>.<\/li><li>The up arrow recalls a previous command.<\/li><li>At <code>--More--<\/code>: Enter displays one more line; Space displays the next screen.<\/li><li>Ctrl+Shift+6 interrupts operations such as ping or traceroute.<\/li><\/ul><p>A syntax error may indicate the wrong mode, an ambiguous abbreviation, or a missing argument. Source: pp. 63–70.<\/p>"}}, {"heading": {"ru": "8. Пароли и сохранение конфигурации", "en": "8. Passwords and saving configuration"}, "html": {"ru": "<p><code>hostname S1<\/code> задаёт имя. <code>enable secret ...<\/code> защищает privileged EXEC. Для консоли или VTY сначала выбирают линию, затем задают <code>password<\/code> и включают проверку командой <code>login<\/code>.<\/p><pre><code>enable\nconfigure terminal\nhostname S1\nline console 0\npassword LAB_PASSWORD\nlogin\nexit\nenable secret LAB_SECRET\nend\ncopy running-config startup-config<\/code><\/pre><p>Это учебный шаблон: значения <code>LAB_PASSWORD<\/code> и <code>LAB_SECRET<\/code> заменяются своими паролями. Для удалённых линий используется <code>line vty 0 15<\/code> на устройстве с 16 VTY. <code>service password-encryption<\/code> скрывает открытые пароли в конфигурации; это не настройка шифрования Telnet. <code>banner motd #текст#<\/code> задаёт предупреждение.<\/p><p><strong>running-config<\/strong> хранится в RAM и действует сразу; RAM теряет содержимое при перезапуске. <strong>startup-config<\/strong> — сохранённая конфигурация в NVRAM, используемая при загрузке. <code>copy running-config startup-config<\/code> сохраняет изменения. <code>show running-config<\/code> только показывает их. Источник: с. 72–80.<\/p>", "en": "<p><code>hostname S1<\/code> sets the device name. <code>enable secret ...<\/code> protects privileged EXEC. For console or VTY access, select the line, set its <code>password<\/code>, and activate checking with <code>login<\/code>.<\/p><pre><code>enable\nconfigure terminal\nhostname S1\nline console 0\npassword LAB_PASSWORD\nlogin\nexit\nenable secret LAB_SECRET\nend\ncopy running-config startup-config<\/code><\/pre><p>This is a study template: replace <code>LAB_PASSWORD<\/code> and <code>LAB_SECRET<\/code> with your own passwords. Remote lines use <code>line vty 0 15<\/code> on a device with 16 VTY lines. <code>service password-encryption<\/code> hides plaintext passwords in the configuration; it does not encrypt Telnet traffic. <code>banner motd #text#<\/code> sets a warning.<\/p><p><strong>running-config<\/strong> is held in RAM and takes effect immediately; RAM contents are lost on restart. <strong>startup-config<\/strong> is the saved configuration in NVRAM used during boot. <code>copy running-config startup-config<\/code> saves changes. <code>show running-config<\/code> only displays them. Source: pp. 72–80.<\/p>"}}], "traps": [{"ru": "SSH шифрует удалённую сессию; пароль Telnet сам по себе этого не делает.", "en": "SSH encrypts a remote session; a Telnet password alone does not."}, {"ru": "running-config = RAM и текущее состояние; startup-config = NVRAM и состояние после загрузки.", "en": "running-config = RAM and current state; startup-config = NVRAM and boot configuration."}, {"ru": "exit — на уровень назад; end — сразу в privileged EXEC.", "en": "exit moves back one level; end goes directly to privileged EXEC."}, {"ru": "Fault tolerance означает резервирование; scalability означает возможность роста.", "en": "Fault tolerance concerns redundancy; scalability concerns growth."}]}, {"id": "l2", "lecture": 2, "title": {"ru": "Протоколы, модели и инкапсуляция", "en": "Protocols, models, and encapsulation"}, "summary": {"ru": "OSI и TCP/IP, названия PDU и главное правило доставки: IP указывает конечного получателя, MAC — получателя на текущем канальном участке.", "en": "OSI and TCP/IP, PDU names, and the core delivery rule: IP identifies the final destination, while MAC identifies the recipient on the current link."}, "sourcePages": "1–59", "sections": [{"heading": {"ru": "1. Какие правила задаёт протокол", "en": "1. What a protocol defines"}, "html": {"ru": "<p>Для связи нужны <strong>источник, получатель и канал<\/strong>. Одного кабеля недостаточно: устройства должны использовать совместимые правила — протоколы. Они определяют кодирование, формат, размер, время передачи и способ доставки сообщения.<\/p><ul><li><strong>Encoding<\/strong> переводит информацию в форму для передачи; decoding выполняет обратное преобразование.<\/li><li><strong>Flow control<\/strong> регулирует скорость и объём отправки.<\/li><li><strong>Response timeout<\/strong> определяет, сколько ждать ответа.<\/li><li><strong>Access method<\/strong> определяет, когда устройство может передавать.<\/li><\/ul><p><strong>Unicast<\/strong> — одному получателю; <strong>multicast<\/strong> — группе; <strong>broadcast<\/strong> — всем в соответствующей области рассылки. В IPv6 broadcast не используется. Не путай группу multicast со всеми устройствами. Источник: с. 6–15.<\/p>", "en": "<p>Communication requires a <strong>source, a destination, and a channel<\/strong>. A cable alone is insufficient: devices need compatible rules called protocols. Protocols define encoding, format, size, timing, and delivery options.<\/p><ul><li><strong>Encoding<\/strong> converts information into a transmissible form; decoding reverses that process.<\/li><li><strong>Flow control<\/strong> regulates the transmission rate and amount of data.<\/li><li><strong>Response timeout<\/strong> determines how long to wait for a reply.<\/li><li><strong>Access method<\/strong> determines when a device may transmit.<\/li><\/ul><p><strong>Unicast<\/strong> means one recipient; <strong>multicast<\/strong> means a selected group; <strong>broadcast<\/strong> means all recipients in the relevant broadcast scope. IPv6 does not use broadcast. Do not confuse a multicast group with every device. Source: pp. 6–15.<\/p>"}}, {"heading": {"ru": "2. Протоколы работают вместе", "en": "2. Protocols work together"}, "html": {"ru": "<p><strong>Protocol suite<\/strong> — набор взаимосвязанных протоколов. Протокол может реализовываться программно, аппаратно или обоими способами. Разные протоколы решают разные задачи: адресация, надёжность, управление потоком, нумерация, обнаружение ошибок.<\/p><table><thead><tr><th>Протокол<\/th><th>Роль в примере веб-связи<\/th><\/tr><\/thead><tbody><tr><td>HTTP<\/td><td>Правила взаимодействия веб-клиента и сервера<\/td><\/tr><tr><td>TCP<\/td><td>Управление разговором, последовательностью, надёжной доставкой и потоком<\/td><\/tr><tr><td>IP<\/td><td>Доставка пакетов между исходным и конечным узлом через сети<\/td><\/tr><tr><td>Ethernet<\/td><td>Передача кадра между интерфейсами на локальном канальном участке<\/td><\/tr><\/tbody><\/table><p>HTTP не заменяет IP, а Ethernet не отвечает за весь маршрут через интернет. Каждый уровень предоставляет услуги следующему. Источник: с. 18–27.<\/p>", "en": "<p>A <strong>protocol suite<\/strong> is a set of related protocols. A protocol may be implemented in software, hardware, or both. Different protocols handle different functions: addressing, reliability, flow control, sequencing, and error detection.<\/p><table><thead><tr><th>Protocol<\/th><th>Role in the web communication example<\/th><\/tr><\/thead><tbody><tr><td>HTTP<\/td><td>Rules for interaction between a web client and server<\/td><\/tr><tr><td>TCP<\/td><td>Conversation management, sequencing, reliable delivery, and flow control<\/td><\/tr><tr><td>IP<\/td><td>Packet delivery from original source to final destination across networks<\/td><\/tr><tr><td>Ethernet<\/td><td>Frame delivery between interfaces on the local link<\/td><\/tr><\/tbody><\/table><p>HTTP does not replace IP, and Ethernet does not manage an entire Internet route. Each layer provides services to the layer above. Source: pp. 18–27.<\/p>"}}, {"heading": {"ru": "3. Организации стандартов", "en": "3. Standards organizations"}, "html": {"ru": "<p>Открытые стандарты позволяют устройствам разных производителей взаимодействовать. Для теста запомни соответствия, а не только расшифровки.<\/p><table><thead><tr><th>Организация<\/th><th>Основная ассоциация<\/th><\/tr><\/thead><tbody><tr><td>IETF<\/td><td>Разработка и поддержка интернет-протоколов и TCP/IP<\/td><\/tr><tr><td>IRTF<\/td><td>Долгосрочные исследования интернета<\/td><\/tr><tr><td>ISOC / IAB<\/td><td>Открытое развитие / архитектурный надзор<\/td><\/tr><tr><td>ICANN / IANA<\/td><td>Координация имён, адресных ресурсов и идентификаторов протоколов<\/td><\/tr><tr><td>IEEE<\/td><td>Стандарты электротехники и сетевых технологий<\/td><\/tr><tr><td>TIA / EIA<\/td><td>Телекоммуникации, кабели, разъёмы и инфраструктура<\/td><\/tr><tr><td>ITU-T<\/td><td>Стандарты телекоммуникаций, включая DSL и видеосвязь<\/td><\/tr><\/tbody><\/table><p>OSI связан с ISO; TCP/IP — с работой IETF. Источник: с. 23, 29–32.<\/p>", "en": "<p>Open standards allow equipment from different vendors to interoperate. For the exam, learn each organization's role rather than only its full name.<\/p><table><thead><tr><th>Organization<\/th><th>Main association<\/th><\/tr><\/thead><tbody><tr><td>IETF<\/td><td>Developing and maintaining Internet protocols and TCP/IP<\/td><\/tr><tr><td>IRTF<\/td><td>Long-term Internet research<\/td><\/tr><tr><td>ISOC / IAB<\/td><td>Open development / architectural oversight<\/td><\/tr><tr><td>ICANN / IANA<\/td><td>Coordination of names, address resources, and protocol identifiers<\/td><\/tr><tr><td>IEEE<\/td><td>Electrical engineering and networking standards<\/td><\/tr><tr><td>TIA / EIA<\/td><td>Telecommunications, wiring, connectors, and infrastructure<\/td><\/tr><tr><td>ITU-T<\/td><td>Telecommunications standards, including DSL and video<\/td><\/tr><\/tbody><\/table><p>Associate OSI with ISO, and TCP/IP development with the IETF. Source: pp. 23, 29–32.<\/p>"}}, {"heading": {"ru": "4. OSI и TCP/IP: точное соответствие", "en": "4. OSI and TCP/IP: the mapping"}, "html": {"ru": "<table><thead><tr><th>OSI<\/th><th>Функция<\/th><th>TCP/IP<\/th><\/tr><\/thead><tbody><tr><td>7 Application — прикладной<\/td><td>Сетевые услуги для процессов<\/td><td>Application<\/td><\/tr><tr><td>6 Presentation — представления<\/td><td>Форма представления данных<\/td><td>Application<\/td><\/tr><tr><td>5 Session — сеансовый<\/td><td>Управление обменом и сеансом<\/td><td>Application<\/td><\/tr><tr><td>4 Transport — транспортный<\/td><td>Сегментация, передача и сборка данных<\/td><td>Transport<\/td><\/tr><tr><td>3 Network — сетевой<\/td><td>IP-адресация и передача между сетями<\/td><td>Internet<\/td><\/tr><tr><td>2 Data Link — канальный<\/td><td>Кадры и доступ к общей среде<\/td><td>Network Access<\/td><\/tr><tr><td>1 Physical — физический<\/td><td>Биты и сигналы в среде<\/td><td>Network Access<\/td><\/tr><\/tbody><\/table><p>OSI — 7 уровней, модель TCP/IP в лекции — 4. Уровни помогают разделять функции, совместно разрабатывать протоколы и менять одну технологию с меньшим влиянием на остальные. Пакет — L3, кадр — L2, биты — L1. Источник: с. 34–38.<\/p>", "en": "<table><thead><tr><th>OSI<\/th><th>Function<\/th><th>TCP/IP<\/th><\/tr><\/thead><tbody><tr><td>7 Application<\/td><td>Network services for application processes<\/td><td>Application<\/td><\/tr><tr><td>6 Presentation<\/td><td>Common representation of data<\/td><td>Application<\/td><\/tr><tr><td>5 Session<\/td><td>Session and exchange management<\/td><td>Application<\/td><\/tr><tr><td>4 Transport<\/td><td>Segmentation, transfer, and reassembly<\/td><td>Transport<\/td><\/tr><tr><td>3 Network<\/td><td>IP addressing and delivery across networks<\/td><td>Internet<\/td><\/tr><tr><td>2 Data Link<\/td><td>Frames and access to shared media<\/td><td>Network Access<\/td><\/tr><tr><td>1 Physical<\/td><td>Bits and signals on the medium<\/td><td>Network Access<\/td><\/tr><\/tbody><\/table><p>OSI has 7 layers; the lecture's TCP/IP model has 4. Layering separates functions, supports protocol design, and limits the effect of changing one technology. Packet belongs to L3, frame to L2, and bits to L1. Source: pp. 34–38.<\/p>"}}, {"heading": {"ru": "5. Сегментация и названия PDU", "en": "5. Segmentation and PDU names"}, "html": {"ru": "<p><strong>Сегментация<\/strong> делит сообщение на части: большой поток не занимает канал непрерывно, а при потере можно повторить только нужную часть. <strong>Мультиплексирование<\/strong> перемежает части нескольких потоков. <strong>Sequencing<\/strong> нумерует сегменты для восстановления порядка.<\/p><p><strong>Инкапсуляция<\/strong> добавляет служебную информацию при движении вниз по стеку. В используемом в лекции TCP-примере порядок такой:<\/p><p><code>Data → Segment → Packet → Frame → Bits<\/code><\/p><p>На приёмнике деинкапсуляция идёт в обратном направлении; уровни обрабатывают и снимают свою служебную информацию. Segment — транспортный уровень, packet — сетевой, frame — канальный. Термин «сегмент» здесь относится к TCP; не называй любой блок данных кадром. Источник: с. 40–44.<\/p>", "en": "<p><strong>Segmentation<\/strong> divides a message into smaller parts: a large stream does not monopolize a link, and only a missing part needs retransmission. <strong>Multiplexing<\/strong> interleaves segments from different streams. <strong>Sequencing<\/strong> numbers segments so their order can be reconstructed.<\/p><p><strong>Encapsulation<\/strong> adds protocol information while data travels down the stack. In the lecture's TCP example, the order is:<\/p><p><code>Data → Segment → Packet → Frame → Bits<\/code><\/p><p>At the receiver, de-encapsulation runs in reverse: layers process and remove their own control information. Segment belongs to transport, packet to network, and frame to data link. “Segment” here refers to TCP; do not call every data unit a frame. Source: pp. 40–44.<\/p>"}}, {"heading": {"ru": "6. IP-адрес и MAC-адрес решают разные задачи", "en": "6. IP and MAC addresses solve different problems"}, "html": {"ru": "<p><strong>L3 IP<\/strong> указывает исходный хост и конечного получателя пакета. <strong>L2 MAC<\/strong> указывает отправителя и получателя кадра на текущем канальном участке. IP-адрес имеет сетевую и узловую части; граница определяется префиксом или маской, а не только внешним видом адреса.<\/p><p>Если получатель в той же подсети, Ethernet-кадр направляется на MAC получателя. Если получатель в удалённой сети, первый кадр направляется на MAC локального интерфейса <strong>default gateway<\/strong>. IP назначения при этом остаётся адресом удалённого хоста.<\/p><p>Шлюз по умолчанию — адрес интерфейса маршрутизатора в локальной сети. Его используют для выхода в другие сети. Отсутствие шлюза не запрещает связь с устройствами в своей подсети. Источник: с. 46–54.<\/p>", "en": "<p><strong>L3 IP<\/strong> identifies the original host and the packet's final destination. <strong>L2 MAC<\/strong> identifies the frame's sender and recipient on the current link. An IP address has network and host portions; their boundary is determined by a prefix or mask, not just by the address's appearance.<\/p><p>If the destination is in the same subnet, the Ethernet frame targets that destination's MAC address. If the destination is remote, the first frame targets the local interface MAC of the <strong>default gateway<\/strong>. The destination IP remains the remote host's address.<\/p><p>The default gateway is the router interface address on the local network. Hosts use it to reach other networks. A missing gateway does not prevent communication within the host's own subnet. Source: pp. 46–54.<\/p>"}}, {"heading": {"ru": "7. Разбор пути PC → R1 → R2 → Server", "en": "7. Walkthrough: PC → R1 → R2 → Server"}, "html": {"ru": "<p>Предположим, все показанные канальные участки Ethernet и преобразование адресов не применяется. <strong>IP-адреса исходного PC и конечного Server сохраняются<\/strong>, а MAC-адреса меняются при каждом переходе через маршрутизатор.<\/p><table><thead><tr><th>Участок<\/th><th>Source MAC<\/th><th>Destination MAC<\/th><\/tr><\/thead><tbody><tr><td>PC → R1<\/td><td>PC<\/td><td>Входной интерфейс R1<\/td><\/tr><tr><td>R1 → R2<\/td><td>Выходной интерфейс R1<\/td><td>Входной интерфейс R2<\/td><\/tr><tr><td>R2 → Server<\/td><td>Выходной интерфейс R2<\/td><td>Server<\/td><\/tr><\/tbody><\/table><p>В тесте сначала определи, о каком участке спрашивают, затем выпиши ближайших отправителя и получателя кадра. Не подставляй MAC сервера в первый кадр к удалённому серверу. Формулировка про сохранение IP относится к адресам, а не к неизменности всех полей IP-пакета. Источник: с. 54–58.<\/p>", "en": "<p>Assume every illustrated link uses Ethernet and no address translation occurs. <strong>The original PC and final Server IP addresses remain the same<\/strong>, while MAC addresses change when a router forwards onto a new link.<\/p><table><thead><tr><th>Link<\/th><th>Source MAC<\/th><th>Destination MAC<\/th><\/tr><\/thead><tbody><tr><td>PC → R1<\/td><td>PC<\/td><td>R1 incoming interface<\/td><\/tr><tr><td>R1 → R2<\/td><td>R1 outgoing interface<\/td><td>R2 incoming interface<\/td><\/tr><tr><td>R2 → Server<\/td><td>R2 outgoing interface<\/td><td>Server<\/td><\/tr><\/tbody><\/table><p>First identify the link asked about, then select that frame's immediate sender and recipient. Do not use the remote server's MAC in the first frame. The statement about unchanged IP addresses does not mean that every IP packet field is unchanged. Source: pp. 54–58.<\/p>"}}], "traps": [{"ru": "Удалённый сервер: destination IP = сервер, destination MAC первого кадра = шлюз.", "en": "Remote server: destination IP = server, first-frame destination MAC = gateway."}, {"ru": "OSI L4 — transport, L3 — network, L2 — data link, L1 — physical.", "en": "OSI L4 is transport, L3 network, L2 data link, and L1 physical."}, {"ru": "Multicast — выбранная группа; broadcast — все в области рассылки; IPv6 не использует broadcast.", "en": "Multicast targets a group; broadcast targets all within its scope; IPv6 has no broadcast."}, {"ru": "Инкапсуляция идёт вниз по стеку; деинкапсуляция — вверх.", "en": "Encapsulation travels down the stack; de-encapsulation travels up."}]}, {"id": "l3", "lecture": 3, "title": {"ru": "Физический уровень и системы счисления", "en": "Physical layer and number systems"}, "summary": {"ru": "Медь, оптоволокно и Wi-Fi; различия bandwidth, throughput и goodput; перевод двоичных и шестнадцатеричных чисел.", "en": "Copper, fiber, and Wi-Fi; bandwidth versus throughput versus goodput; binary and hexadecimal conversions."}, "sourcePages": "1–54", "sections": [{"heading": {"ru": "1. Что делает физический уровень", "en": "1. What the physical layer does"}, "html": {"ru": "<p><strong>Physical layer (L1)<\/strong> передаёт биты через среду. Он получает кадр от L2 и представляет его последовательностью физических сигналов. NIC соединяет устройство с сетью; у одного хоста может быть несколько проводных и беспроводных адаптеров.<\/p><p>Стандарты L1 описывают три области: <strong>компоненты<\/strong> (кабели, разъёмы, интерфейсы), <strong>encoding<\/strong> (правила представления битового потока) и <strong>signaling<\/strong> (физическое выражение нулей и единиц). В меди используются электрические сигналы, в оптоволокне — свет, в беспроводной связи — радиосигналы.<\/p><p>Manchester, 4B/5B и 8B/10B — примеры кодирования из лекции. Кодирование для передачи не следует путать с шифрованием ради конфиденциальности. Источник: с. 5–13.<\/p>", "en": "<p>The <strong>physical layer (L1)<\/strong> transports bits through a medium. It receives a frame from L2 and represents it as a sequence of physical signals. A NIC connects a device to the network; a host may have several wired and wireless adapters.<\/p><p>L1 standards cover three areas: <strong>components<\/strong> such as cables, connectors, and interfaces; <strong>encoding<\/strong>, the representation rules for the bit stream; and <strong>signaling<\/strong>, the physical expression of zeros and ones. Copper uses electrical signals, fiber uses light, and wireless uses radio signals.<\/p><p>Manchester, 4B/5B, and 8B/10B are encoding examples in the lecture. Transmission encoding should not be confused with encryption for confidentiality. Source: pp. 5–13.<\/p>"}}, {"heading": {"ru": "2. Bandwidth, throughput, goodput и latency", "en": "2. Bandwidth, throughput, goodput, and latency"}, "html": {"ru": "<table><thead><tr><th>Понятие<\/th><th>Смысл<\/th><\/tr><\/thead><tbody><tr><td>Bandwidth<\/td><td>Пропускная способность среды: сколько бит в секунду она может переносить<\/td><\/tr><tr><td>Throughput<\/td><td>Измеренная скорость передачи битов<\/td><\/tr><tr><td>Goodput<\/td><td>Скорость передачи полезных данных без служебных накладных расходов<\/td><\/tr><tr><td>Latency<\/td><td>Время прохождения данных с учётом задержек<\/td><\/tr><\/tbody><\/table><p><code>Goodput = Throughput − overhead<\/code>. Если throughput = 80 Мбит/с, а служебный трафик занимает 8 Мбит/с, goodput = 72 Мбит/с. Это применение определения, а не скорость конкретной технологии.<\/p><p>В сетевых единицах <strong>1 Kbps = 1000 bps<\/strong>, 1 Mbps = 10⁶ bps, 1 Gbps = 10⁹ bps. Не путай бит и байт: 8 бит = 1 байт. Задержка — время, пропускная способность — скорость. Источник: с. 14–15, 42.<\/p>", "en": "<table><thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Bandwidth<\/td><td>The medium's capacity: how many bits per second it can carry<\/td><\/tr><tr><td>Throughput<\/td><td>The measured rate of bit transfer<\/td><\/tr><tr><td>Goodput<\/td><td>The rate of useful data transfer, excluding overhead<\/td><\/tr><tr><td>Latency<\/td><td>The time data takes to travel, including delays<\/td><\/tr><\/tbody><\/table><p><code>Goodput = Throughput − overhead<\/code>. If throughput is 80 Mbps and overhead is 8 Mbps, goodput is 72 Mbps. This applies the definition; it is not a claim about a particular technology's speed.<\/p><p>In network units, <strong>1 Kbps = 1000 bps<\/strong>, 1 Mbps = 10⁶ bps, and 1 Gbps = 10⁹ bps. Do not confuse bits and bytes: 8 bits = 1 byte. Latency measures time; bandwidth measures a rate. Source: pp. 14–15, 42.<\/p>"}}, {"heading": {"ru": "3. Медные кабели и помехи", "en": "3. Copper cables and interference"}, "html": {"ru": "<p><strong>Attenuation<\/strong> — ослабление сигнала с расстоянием. <strong>EMI/RFI<\/strong> — внешние электромагнитные/радиочастотные помехи. <strong>Crosstalk<\/strong> — влияние сигнала соседней пары.<\/p><ul><li><strong>UTP<\/strong>: четыре витые пары, без металлического экрана, разъём RJ-45. Скручивание и взаимная компенсация помогают снижать помехи.<\/li><li><strong>STP<\/strong>: дополнительное экранирование, лучшая защита от помех, выше цена и сложность установки.<\/li><li><strong>Coaxial<\/strong>: центральный проводник, изоляция и внешний проводящий экран; применяется в кабельном доступе и подключении антенн.<\/li><\/ul><p>Соблюдение допустимой длины помогает бороться с затуханием. Экранирование с корректным заземлением уменьшает EMI/RFI; скручивание пар уменьшает перекрёстные помехи. Эти меры решают разные проблемы. Источник: с. 17–27.<\/p>", "en": "<p><strong>Attenuation<\/strong> is signal weakening over distance. <strong>EMI/RFI<\/strong> is external electromagnetic or radio-frequency interference. <strong>Crosstalk<\/strong> is interference caused by a neighboring wire pair.<\/p><ul><li><strong>UTP<\/strong>: four twisted pairs, no metallic shielding, and RJ-45 connectors. Twisting and cancellation help reduce interference.<\/li><li><strong>STP<\/strong>: added shielding, better noise protection, and greater installation cost and complexity.<\/li><li><strong>Coaxial<\/strong>: a central conductor, insulation, and an outer conductive shield; used for cable access and antenna connections.<\/li><\/ul><p>Respecting cable-length limits helps control attenuation. Shielding with proper grounding reduces EMI/RFI; twisting pairs reduces crosstalk. These measures address different problems. Source: pp. 17–27.<\/p>"}}, {"heading": {"ru": "4. Straight-through, crossover и rollover", "en": "4. Straight-through, crossover, and rollover"}, "html": {"ru": "<table><thead><tr><th>Кабель<\/th><th>Оконцовка<\/th><th>Учебный пример<\/th><\/tr><\/thead><tbody><tr><td>Straight-through — прямой<\/td><td>T568A–T568A или T568B–T568B<\/td><td>PC–switch<\/td><\/tr><tr><td>Crossover — перекрёстный<\/td><td>T568A–T568B<\/td><td>Switch–switch без Auto-MDIX<\/td><\/tr><tr><td>Rollover — консольный<\/td><td>Специальная консольная разводка<\/td><td>Терминал–console устройства<\/td><\/tr><\/tbody><\/table><p>В классическом выборе кабеля однотипные Ethernet-устройства часто используют crossover, а PC–switch — straight-through. <strong>Auto-MDIX<\/strong> автоматически определяет нужное соединение, поэтому эта необходимость на поддерживающих его портах исчезает. Rollover служит для управления через консоль, а не обычного Ethernet-трафика. Источник: с. 28.<\/p>", "en": "<table><thead><tr><th>Cable<\/th><th>Termination<\/th><th>Study example<\/th><\/tr><\/thead><tbody><tr><td>Straight-through<\/td><td>T568A–T568A or T568B–T568B<\/td><td>PC–switch<\/td><\/tr><tr><td>Crossover<\/td><td>T568A–T568B<\/td><td>Switch–switch without Auto-MDIX<\/td><\/tr><tr><td>Rollover<\/td><td>Special console wiring<\/td><td>Terminal–device console<\/td><\/tr><\/tbody><\/table><p>In traditional cable-selection questions, similar Ethernet devices commonly require crossover, while PC–switch uses straight-through. <strong>Auto-MDIX<\/strong> automatically detects the needed connection, removing that requirement on supported ports. Rollover is for console management, not ordinary Ethernet data traffic. Source: p. 28.<\/p>"}}, {"heading": {"ru": "5. Оптоволокно: когда оно подходит", "en": "5. Fiber: when it fits"}, "html": {"ru": "<p>Оптоволокно передаёт свет по тонким волокнам. Оно <strong>невосприимчиво к EMI/RFI<\/strong> и подходит для магистралей, соединения зданий, дальней связи и подводных линий. Монтаж и разъёмы обычно дороже, чем у UTP.<\/p><table><thead><tr><th>Тип<\/th><th>Главное различие<\/th><\/tr><\/thead><tbody><tr><td>SMF — single-mode<\/td><td>Очень маленькая сердцевина, лазер, применение на больших расстояниях<\/td><\/tr><tr><td>MMF — multimode<\/td><td>Более широкая сердцевина, несколько путей света, больше дисперсия<\/td><\/tr><\/tbody><\/table><p><strong>Dispersion<\/strong> — расширение светового импульса во времени. Для экзамена важнее различать SMF и MMF, чем запоминать одну универсальную дистанцию: дальность зависит от конкретного стандарта и оборудования. Разъёмы из лекции: <strong>ST, SC, LC<\/strong>. Источник: с. 30–36.<\/p>", "en": "<p>Optical fiber carries light through thin strands. It is <strong>immune to EMI/RFI<\/strong> and suits backbones, interbuilding links, long-haul communication, and submarine cables. Installation and connectors generally cost more than UTP.<\/p><table><thead><tr><th>Type<\/th><th>Key distinction<\/th><\/tr><\/thead><tbody><tr><td>SMF — single-mode<\/td><td>Very small core, laser source, and long-distance applications<\/td><\/tr><tr><td>MMF — multimode<\/td><td>Larger core, multiple light paths, and greater dispersion<\/td><\/tr><\/tbody><\/table><p><strong>Dispersion<\/strong> is the spreading of a light pulse over time. Focus on distinguishing SMF and MMF instead of treating one distance as universal: reach depends on the specific standard and equipment. Connector names in the lecture are <strong>ST, SC, and LC<\/strong>. Source: pp. 30–36.<\/p>"}}, {"heading": {"ru": "6. Беспроводная среда", "en": "6. Wireless media"}, "html": {"ru": "<p>Беспроводная связь даёт мобильность, но зависит от покрытия, препятствий, помех и числа пользователей. Общая среда означает конкуренцию за доступ. В базовой модели WLAN из лекции используется half-duplex: передача и приём на одном канале не выполняются одновременно одним радиоинтерфейсом.<\/p><table><thead><tr><th>Технология<\/th><th>Ассоциация<\/th><\/tr><\/thead><tbody><tr><td>Wi-Fi / IEEE 802.11<\/td><td>WLAN — беспроводная локальная сеть<\/td><\/tr><tr><td>Bluetooth / IEEE 802.15<\/td><td>WPAN — персональная сеть, как представлено в лекции<\/td><\/tr><tr><td>WiMAX / IEEE 802.16<\/td><td>Широкополосный беспроводной доступ<\/td><\/tr><tr><td>Zigbee / IEEE 802.15.4<\/td><td>Низкое энергопотребление, небольшая скорость, IoT<\/td><\/tr><\/tbody><\/table><p>Типичная WLAN использует точку доступа AP и беспроводные NIC клиентов. Радиопокрытие выходит за пределы кабеля, поэтому безопасность доступа особенно важна. Источник: с. 38–40.<\/p>", "en": "<p>Wireless communication provides mobility but depends on coverage, obstacles, interference, and user count. A shared medium means competition for access. The lecture's basic WLAN model uses half-duplex: one radio interface does not transmit and receive simultaneously on the same channel.<\/p><table><thead><tr><th>Technology<\/th><th>Association<\/th><\/tr><\/thead><tbody><tr><td>Wi-Fi / IEEE 802.11<\/td><td>WLAN — wireless local area network<\/td><\/tr><tr><td>Bluetooth / IEEE 802.15<\/td><td>WPAN — personal area networking, as presented in the lecture<\/td><\/tr><tr><td>WiMAX / IEEE 802.16<\/td><td>Broadband wireless access<\/td><\/tr><tr><td>Zigbee / IEEE 802.15.4<\/td><td>Low power, low data rate, and IoT<\/td><\/tr><\/tbody><\/table><p>A typical WLAN uses an access point (AP) and wireless client NICs. Radio coverage is not confined to a cable, making access security especially important. Source: pp. 38–40.<\/p>"}}, {"heading": {"ru": "7. Двоичные и шестнадцатеричные числа", "en": "7. Binary and hexadecimal numbers"}, "html": {"ru": "<p><strong>IPv4 = 32 бита = 4 октета<\/strong>. Один октет — 8 бит, значения от 0 до 255. Веса битов слева направо:<\/p><p><code>128 · 64 · 32 · 16 · 8 · 4 · 2 · 1<\/code><\/p><p>Для <code>10101000<\/code> складываем веса единиц: 128 + 32 + 8 = <strong>168<\/strong>. Для обратного перевода последовательно вычитаем подходящие веса. Пример адреса из лекции: <code>11000000.10101000.00001011.00001010<\/code> = <code>192.168.11.10<\/code>.<\/p><p>Hex — основание 16: цифры 0–9 и буквы A–F, где A=10, B=11, C=12, D=13, E=14, F=15. <strong>Одна hex-цифра = 4 бита<\/strong>. Поэтому <code>1010 1000<\/code> = <code>A8<\/code> = 168; <code>D2<\/code> = 13×16+2 = 210.<\/p><p><strong>IPv6 = 128 бит = 32 hex-цифры<\/strong> в полной записи. Четыре hex-цифры образуют hextet (16 бит); полная запись содержит восемь hextet. Hex также используется для MAC-адресов. Источник: с. 42–53.<\/p>", "en": "<p><strong>IPv4 = 32 bits = 4 octets<\/strong>. An octet contains 8 bits and represents values from 0 to 255. Bit weights from left to right are:<\/p><p><code>128 · 64 · 32 · 16 · 8 · 4 · 2 · 1<\/code><\/p><p>For <code>10101000<\/code>, add the weights containing ones: 128 + 32 + 8 = <strong>168<\/strong>. To convert back, subtract the applicable weights in order. The lecture's address example is <code>11000000.10101000.00001011.00001010<\/code> = <code>192.168.11.10<\/code>.<\/p><p>Hexadecimal uses base 16: digits 0–9 and letters A–F, where A=10, B=11, C=12, D=13, E=14, and F=15. <strong>One hex digit = 4 bits<\/strong>. Thus <code>1010 1000<\/code> = <code>A8<\/code> = 168; <code>D2<\/code> = 13×16+2 = 210.<\/p><p><strong>IPv6 = 128 bits = 32 hex digits<\/strong> in full notation. Four hex digits form a hextet (16 bits); a full address has eight hextets. Hexadecimal is also used for MAC addresses. Source: pp. 42–53.<\/p>"}}], "traps": [{"ru": "Goodput исключает служебный трафик; throughput включает переданные биты в измерении.", "en": "Goodput excludes overhead; throughput measures transferred bits."}, {"ru": "UTP не имеет металлического экрана; STP имеет. Оптоволокно невосприимчиво к EMI/RFI.", "en": "UTP has no metallic shield; STP does. Fiber is immune to EMI/RFI."}, {"ru": "Одна hex-цифра — 4 бита, один октет — 8 бит, один hextet — 16 бит.", "en": "One hex digit is 4 bits, one octet is 8 bits, and one hextet is 16 bits."}, {"ru": "Straight-through: одинаковые схемы на концах; crossover: T568A и T568B.", "en": "Straight-through uses matching termination schemes; crossover uses T568A and T568B."}]}, {"id": "l4", "lecture": 4, "title": {"ru": "Канальный уровень и Ethernet", "en": "Data link layer and Ethernet"}, "summary": {"ru": "Как кадр проходит по локальной сети: MAC-адреса, коммутация, топологии и методы пересылки.", "en": "How frames cross a local network: MAC addresses, switching, topologies and forwarding methods."}, "sourcePages": "1–55", "sections": [{"heading": {"ru": "Что делает Layer 2", "en": "What Layer 2 does"}, "html": {"ru": "<p>Канальный уровень обеспечивает доставку по конкретному каналу связи. Он помещает пакет Layer 3 в <strong>кадр<\/strong>, добавляя заголовок и трейлер. Ethernet работает на канальном и физическом уровнях. Проверка ошибок позволяет обнаружить повреждённый кадр и отбросить его; это не означает, что Ethernet сам гарантирует повторную передачу.<\/p><p>В модели IEEE 802 подуровень <strong>LLC<\/strong> связывает верхние протоколы с нижними уровнями и помогает определить протокол сетевого уровня. Подуровень <strong>MAC<\/strong> отвечает за формат кадра, адресацию и доступ к среде. Источник: с. 6–10.<\/p>", "en": "<p>The data link layer delivers data across an individual link. It encapsulates a Layer 3 packet in a <strong>frame<\/strong>, adding a header and trailer. Ethernet operates at the data link and physical layers. Error detection lets a receiver identify and discard a damaged frame; it does not mean Ethernet itself guarantees retransmission.<\/p><p>In the IEEE 802 model, <strong>LLC<\/strong> connects upper protocols with lower layers and helps identify the network layer protocol. <strong>MAC<\/strong> handles framing, addressing and media access. Source: pp. 6–10.<\/p>"}}, {"heading": {"ru": "Кадр Ethernet: важные числа", "en": "Ethernet frames: essential numbers"}, "html": {"ru": "<p>Обычный нетегированный Ethernet-кадр имеет размер <strong>64–1518 байт<\/strong>; преамбула и SFD в этот размер не включаются. Максимальные обычные данные составляют 1500 байт. Не путай размер всего кадра и его полезной нагрузки. Кадр короче 64 байт называется <em>runt<\/em>.<\/p><p>Заголовок содержит MAC-адреса назначения и источника, а также поле типа/длины. Полезная нагрузка переносит данные верхнего уровня. <strong>FCS<\/strong> в трейлере служит для обнаружения ошибок с помощью CRC. Jumbo frames требуют поддержки соответствующего размера. Источник: с. 10, 12, 25–26.<\/p>", "en": "<p>A normal untagged Ethernet frame is <strong>64–1518 bytes<\/strong>; the preamble and SFD are excluded from this size. Its normal maximum payload is 1500 bytes. Do not confuse total frame size with payload size. A frame shorter than 64 bytes is a <em>runt<\/em>.<\/p><p>The header carries destination and source MAC addresses and a type/length field. The payload carries upper-layer data. The trailer contains the <strong>FCS<\/strong>, used for CRC-based error detection. Jumbo frames require support for their larger size. Source: pp. 10, 12, 25–26.<\/p>"}}, {"heading": {"ru": "Топология и дуплекс", "en": "Topology and duplex"}, "html": {"ru": "<p><strong>Физическая топология<\/strong> показывает кабели и реальные соединения; <strong>логическая<\/strong> — взаимодействие интерфейсов и схему адресации. Для LAN типичны звезда и расширенная звезда. В WAN встречаются point-to-point, hub-and-spoke и mesh. Полная mesh даёт несколько путей, но требует большого числа соединений.<\/p><p><strong>Half-duplex:<\/strong> передача и приём по очереди. <strong>Full-duplex:<\/strong> одновременная передача и приём. На современных коммутируемых полнодуплексных Ethernet-соединениях CSMA/CD не используется. Несовпадение дуплекса на концах соединения ухудшает производительность. Источник: с. 15–20, 52–53.<\/p>", "en": "<p>A <strong>physical topology<\/strong> shows cables and actual connections; a <strong>logical topology<\/strong> shows interface relationships and addressing. LANs commonly use star or extended-star layouts. WAN layouts include point-to-point, hub-and-spoke and mesh. A full mesh provides alternative paths but requires many connections.<\/p><p><strong>Half-duplex:<\/strong> sending and receiving take turns. <strong>Full-duplex:<\/strong> both happen simultaneously. Modern switched full-duplex Ethernet does not use CSMA/CD. A duplex mismatch between link partners can cause poor performance. Source: pp. 15–20, 52–53.<\/p>"}}, {"heading": {"ru": "CD обнаруживает, CA избегает", "en": "CD detects; CA avoids"}, "html": {"ru": "<table><thead><tr><th>Метод<\/th><th>Где применяется<\/th><th>Смысл<\/th><\/tr><\/thead><tbody><tr><td>CSMA/CD<\/td><td>Старый half-duplex Ethernet, хабы<\/td><td>Обнаружить коллизию, подождать случайное время, повторить<\/td><\/tr><tr><td>CSMA/CA<\/td><td>Wi-Fi, IEEE 802.11<\/td><td>Снизить вероятность коллизии до передачи<\/td><\/tr><\/tbody><\/table><p>Оба метода относятся к конкурентному доступу: устройства делят среду. При управляемом доступе узел получает определённую возможность передать данные, как в старых Token Ring. Сам факт использования Ethernet не означает обязательное наличие коллизий: важно, общий ли канал и какой дуплекс используется. Источник: с. 21–23.<\/p>", "en": "<table><thead><tr><th>Method<\/th><th>Used by<\/th><th>Idea<\/th><\/tr><\/thead><tbody><tr><td>CSMA/CD<\/td><td>Legacy half-duplex Ethernet and hubs<\/td><td>Detect a collision, wait randomly and retransmit<\/td><\/tr><tr><td>CSMA/CA<\/td><td>Wi-Fi, IEEE 802.11<\/td><td>Reduce collision probability before transmission<\/td><\/tr><\/tbody><\/table><p>Both are contention-based methods: devices compete for a shared medium. Controlled access assigns a transmission opportunity, as in legacy Token Ring. Ethernet does not automatically imply collisions: the shared-medium arrangement and duplex mode matter. Source: pp. 21–23.<\/p>"}}, {"heading": {"ru": "MAC: один, все или группа", "en": "MAC: one, everyone or a group"}, "html": {"ru": "<p>MAC-адрес Ethernet — <strong>48 бит = 6 байт = 12 шестнадцатеричных цифр<\/strong>. В стандартном описании аппаратного адреса первые 24 бита — OUI производителя, оставшиеся 24 назначает производитель. Один байт записывается двумя hex-цифрами: например, <code>0A<\/code>.<\/p><ul><li><strong>Unicast:<\/strong> один получатель; MAC источника — unicast.<\/li><li><strong>Broadcast:<\/strong> <code>FF:FF:FF:FF:FF:FF<\/code>, все устройства локального broadcast-домена.<\/li><li><strong>Multicast:<\/strong> группа; для IPv4 используется префикс <code>01:00:5E<\/code>, для IPv6 — <code>33:33<\/code>.<\/li><\/ul><p>Обычная маршрутизация не переносит Ethernet broadcast в другую сеть. Источник: с. 31–36.<\/p>", "en": "<p>An Ethernet MAC address is <strong>48 bits = 6 bytes = 12 hexadecimal digits<\/strong>. In the standard hardware-address description, the first 24 bits form the vendor OUI and the remaining 24 are vendor-assigned. A byte uses two hex digits, such as <code>0A<\/code>.<\/p><ul><li><strong>Unicast:<\/strong> one recipient; a source MAC is unicast.<\/li><li><strong>Broadcast:<\/strong> <code>FF:FF:FF:FF:FF:FF<\/code>, all devices in the local broadcast domain.<\/li><li><strong>Multicast:<\/strong> a group; IPv4 uses prefix <code>01:00:5E<\/code>, IPv6 uses <code>33:33<\/code>.<\/li><\/ul><p>Ordinary routing does not carry an Ethernet broadcast into another network. Source: pp. 31–36.<\/p>"}}, {"heading": {"ru": "Коммутатор: учится по источнику", "en": "Switches learn from the source"}, "html": {"ru": "<p><strong>Обучение:<\/strong> коммутатор записывает MAC источника и входной порт в MAC/CAM-таблицу. <strong>Пересылка:<\/strong> ищет MAC назначения. Если он известен, выбирает соответствующий выходной порт. Если неизвестен, выполняет flooding по другим портам того же VLAN, кроме входного. Broadcast также распространяется в своём домене.<\/p><p>Пример: кадр от A пришёл в порт 1, а B пока неизвестен. Коммутатор запомнит <code>A → port 1<\/code> и разошлёт кадр. Ответ B позволит выучить порт B. Обычный L2-коммутатор не заменяет MAC-адреса источника и назначения при пересылке. Источник: с. 38–41; Lecture 5, с. 29–30.<\/p>", "en": "<p><strong>Learning:<\/strong> the switch stores the source MAC and incoming port in its MAC/CAM table. <strong>Forwarding:<\/strong> it looks up the destination MAC. A known destination selects its outgoing port. An unknown destination causes flooding to other ports in the same VLAN, excluding the incoming port. Broadcasts are also flooded within their domain.<\/p><p>Example: A sends a frame through port 1 while B is unknown. The switch learns <code>A → port 1<\/code> and floods the frame. B’s reply teaches it B’s port. An ordinary Layer 2 switch does not replace source and destination MAC addresses while forwarding. Source: pp. 38–41; Lecture 5, pp. 29–30.<\/p>"}}, {"heading": {"ru": "Методы пересылки и буферизация", "en": "Forwarding methods and buffering"}, "html": {"ru": "<p><strong>Store-and-forward<\/strong> принимает кадр целиком и проверяет CRC перед отправкой. <strong>Cut-through<\/strong> начинает пересылку раньше, после чтения MAC назначения: задержка меньше, но повреждённый кадр может уйти дальше. Fast-forward — наиболее быстрый вариант; fragment-free сначала ожидает первые 64 байта.<\/p><p>Буферы удерживают кадры при занятом выходном порте. Port-based memory связывает очереди с портами; shared memory распределяет общую память динамически и полезна при разных скоростях портов. Autonegotiation согласует скорость и дуплекс, а auto-MDIX помогает автоматически учесть тип соединения кабеля. Источник: с. 49–54.<\/p>", "en": "<p><strong>Store-and-forward<\/strong> receives the complete frame and checks its CRC before transmission. <strong>Cut-through<\/strong> starts earlier, after reading the destination MAC: latency is lower, but damaged frames can be forwarded. Fast-forward is the lowest-latency version; fragment-free waits for the first 64 bytes.<\/p><p>Buffers retain frames when an output port is busy. Port-based memory associates queues with ports; shared memory allocates a common pool dynamically and helps with unequal port speeds. Autonegotiation agrees speed and duplex, while auto-MDIX helps automatically accommodate the cable connection type. Source: pp. 49–54.<\/p>"}}], "traps": [{"ru": "Учится по source MAC, отправляет по destination MAC.", "en": "Learn using source MAC; forward using destination MAC."}, {"ru": "64–1518 байт — кадр; 1500 байт — обычная максимальная полезная нагрузка.", "en": "64–1518 bytes is the frame; 1500 bytes is the usual maximum payload."}, {"ru": "CSMA/CD — обнаружение коллизий, CSMA/CA — предотвращение.", "en": "CSMA/CD detects collisions; CSMA/CA avoids them."}, {"ru": "MAC-таблица хранит MAC → порт; ARP-таблица хранит IPv4 → MAC.", "en": "A MAC table maps MAC → port; an ARP table maps IPv4 → MAC."}]}, {"id": "l5", "lecture": 5, "title": {"ru": "IP, ARP и маршрутизация", "en": "IP, ARP and routing"}, "summary": {"ru": "Как пакет достигает другой сети, какие адреса меняются и какие команды проверяют маршрутизатор.", "en": "How a packet reaches a remote network, which addresses change and which commands verify a router."}, "sourcePages": "1–59", "sections": [{"heading": {"ru": "Роль IP и три характеристики", "en": "IP’s role and three characteristics"}, "html": {"ru": "<p>Сетевой уровень выполняет <strong>адресацию, инкапсуляцию, маршрутизацию и декапсуляцию<\/strong>. IP помещает транспортный сегмент в пакет и использует логические адреса источника и назначения. Маршрутизаторы принимают решение по адресу назначения и таблице маршрутизации.<\/p><ul><li><strong>Connectionless:<\/strong> IP не устанавливает соединение перед отправкой.<\/li><li><strong>Best effort:<\/strong> доставка, порядок и повторная передача не гарантируются самим IP.<\/li><li><strong>Media independent:<\/strong> один IP-пакет может передаваться через медь, оптоволокно и беспроводную среду.<\/li><\/ul><p>Надёжность при необходимости обеспечивает другой протокол, например TCP. Источник: с. 7–13.<\/p>", "en": "<p>The network layer performs <strong>addressing, encapsulation, routing and de-encapsulation<\/strong>. IP places a transport segment inside a packet and uses logical source and destination addresses. Routers decide where to forward it using the destination address and routing table.<\/p><ul><li><strong>Connectionless:<\/strong> IP establishes no connection before sending.<\/li><li><strong>Best effort:<\/strong> IP itself guarantees neither delivery, ordering nor retransmission.<\/li><li><strong>Media independent:<\/strong> an IP packet can cross copper, fiber and wireless media.<\/li><\/ul><p>Another protocol, such as TCP, supplies reliability when required. Source: pp. 7–13.<\/p>"}}, {"heading": {"ru": "IPv4 и IPv6: поля заголовка", "en": "IPv4 and IPv6 header fields"}, "html": {"ru": "<table><thead><tr><th>Назначение<\/th><th>IPv4<\/th><th>IPv6<\/th><\/tr><\/thead><tbody><tr><td>Размер адреса<\/td><td>32 бита<\/td><td>128 бит<\/td><\/tr><tr><td>Ограничение числа переходов<\/td><td>TTL<\/td><td>Hop Limit<\/td><\/tr><tr><td>Следующий протокол<\/td><td>Protocol<\/td><td>Next Header<\/td><\/tr><tr><td>Приоритет/QoS<\/td><td>Differentiated Services<\/td><td>Traffic Class<\/td><\/tr><tr><td>Контрольная сумма заголовка<\/td><td>Есть<\/td><td>Нет в базовом заголовке<\/td><\/tr><\/tbody><\/table><p>Базовый IPv6-заголовок имеет фиксированный размер <strong>40 байт<\/strong>. Flow Label выделяет поток, Payload Length указывает размер полезной нагрузки. TTL/Hop Limit уменьшается при прохождении маршрутизатора; исчерпание лимита приводит к отбрасыванию. Источник: с. 19, 23–27.<\/p>", "en": "<table><thead><tr><th>Purpose<\/th><th>IPv4<\/th><th>IPv6<\/th><\/tr><\/thead><tbody><tr><td>Address size<\/td><td>32 bits<\/td><td>128 bits<\/td><\/tr><tr><td>Hop restriction<\/td><td>TTL<\/td><td>Hop Limit<\/td><\/tr><tr><td>Following protocol<\/td><td>Protocol<\/td><td>Next Header<\/td><\/tr><tr><td>Priority/QoS<\/td><td>Differentiated Services<\/td><td>Traffic Class<\/td><\/tr><tr><td>Header checksum<\/td><td>Present<\/td><td>Absent from base header<\/td><\/tr><\/tbody><\/table><p>The basic IPv6 header has a fixed size of <strong>40 bytes<\/strong>. Flow Label identifies a flow; Payload Length specifies payload size. TTL/Hop Limit is reduced by routers, and an exhausted limit causes the packet to be dropped. Source: pp. 19, 23–27.<\/p>"}}, {"heading": {"ru": "MTU и адреса на пути", "en": "MTU and addresses along the path"}, "html": {"ru": "<p><strong>MTU<\/strong> ограничивает размер пакета, который может передаваться через конкретный канал без фрагментации. IPv4-пакет при соответствующих условиях может быть фрагментирован. Точная формулировка для IPv6: <strong>маршрутизаторы не фрагментируют IPv6-пакеты<\/strong>; не обобщай это до полного отсутствия фрагментации в IPv6.<\/p><p>При обычной маршрутизации без NAT IP-адреса конечных узлов сохраняются. Но Ethernet-кадр действует в пределах текущего канала: маршрутизатор снимает старую L2-оболочку и формирует новую для следующего перехода. Заголовок IP при этом не полностью неизменен: TTL/Hop Limit меняется. Источник: с. 9, 14, 19, 27, 29–30.<\/p>", "en": "<p><strong>MTU<\/strong> limits the packet size a particular link can carry without fragmentation. IPv4 packets can be fragmented under appropriate conditions. The precise IPv6 statement is: <strong>routers do not fragment IPv6 packets<\/strong>; do not turn this into a claim that IPv6 has no fragmentation at all.<\/p><p>During ordinary routing without NAT, endpoint IP addresses remain the same. An Ethernet frame is local to its current link: a router removes its old Layer 2 envelope and constructs another for the next hop. The IP header is not entirely unchanged: TTL/Hop Limit changes. Source: pp. 9, 14, 19, 27, 29–30.<\/p>"}}, {"heading": {"ru": "Локальная сеть или шлюз", "en": "Local destination or default gateway"}, "html": {"ru": "<p>Если получатель в своей подсети, хост отправляет кадр на <strong>MAC получателя<\/strong>. Если получатель в другой сети, Ethernet-кадр идёт на <strong>MAC локального интерфейса шлюза<\/strong>. IP назначения всё равно остаётся адресом конечного получателя.<\/p><p>Пример: PC <code>192.168.10.20/24<\/code> обращается к <code>203.0.113.9<\/code>, шлюз — <code>192.168.10.1<\/code>. Destination IP = <code>203.0.113.9<\/code>, destination MAC = MAC шлюза. Сам адрес шлюза должен быть достижим в локальной подсети хоста. Источник: с. 29–32, 57.<\/p>", "en": "<p>For a destination in the same subnet, the host addresses its frame to the <strong>destination host’s MAC<\/strong>. For a destination in another network, the Ethernet frame goes to the <strong>MAC of the local gateway interface<\/strong>. Its destination IP still identifies the final recipient.<\/p><p>Example: PC <code>192.168.10.20/24<\/code> accesses <code>203.0.113.9<\/code> through gateway <code>192.168.10.1<\/code>. Destination IP = <code>203.0.113.9<\/code>; destination MAC = the gateway’s MAC. The gateway itself must be reachable in the host’s local subnet. Source: pp. 29–32, 57.<\/p>"}}, {"heading": {"ru": "ARP и Neighbor Discovery", "en": "ARP and Neighbor Discovery"}, "html": {"ru": "<p><strong>ARP<\/strong> сопоставляет локальный IPv4-адрес с MAC. Сначала проверяется ARP-таблица. Если записи нет, отправляется broadcast ARP request. Для удалённого адресата разрешается IPv4-адрес шлюза, а не удалённого сервера. Записи кеша стареют; ложные ARP-ответы могут привести к ARP poisoning.<\/p><p>IPv6 использует <strong>Neighbor Discovery через ICMPv6<\/strong>. NS/NA — Neighbor Solicitation/Advertisement — участвуют в разрешении адресов. RS/RA — Router Solicitation/Advertisement — в обнаружении маршрутизаторов. Для разрешения адреса NS отправляется на solicited-node multicast; при проверке достижимости возможен unicast. Проверка ARP: <code>show ip arp<\/code> на Cisco и <code>arp -a<\/code> на ПК. Источник: с. 31–37.<\/p>", "en": "<p><strong>ARP<\/strong> maps a local IPv4 address to a MAC address. A device checks its ARP table first. If no entry exists, it sends a broadcast ARP request. For a remote recipient, it resolves the gateway’s IPv4 address, not the remote server’s address. Cache entries expire; forged replies can cause ARP poisoning.<\/p><p>IPv6 uses <strong>Neighbor Discovery through ICMPv6<\/strong>. NS/NA—Neighbor Solicitation/Advertisement—perform address resolution. RS/RA—Router Solicitation/Advertisement—support router discovery. For address resolution, NS is sent to solicited-node multicast; reachability checks can use unicast. Inspect ARP using <code>show ip arp<\/code> on Cisco or <code>arp -a<\/code> on a PC. Source: pp. 31–37.<\/p>"}}, {"heading": {"ru": "Читаем таблицу маршрутизации", "en": "Reading a routing table"}, "html": {"ru": "<p><strong>Connected<\/strong> сеть появляется автоматически, когда настроенный интерфейс активен. <strong>Static<\/strong> маршрут задаёт администратор. <strong>Dynamic<\/strong> маршруты изучаются через протокол маршрутизации и обновляются при изменениях топологии. <strong>Default route<\/strong> применяется, когда подходящего более конкретного маршрута нет.<\/p><p>В выводе <code>show ip route<\/code>: <code>C<\/code> — подключённая сеть; <code>L<\/code> — собственный адрес интерфейса; <code>S<\/code> — статический; <code>O<\/code> — OSPF; <code>D<\/code> — EIGRP. Например, <code>C 192.168.10.0/24<\/code> описывает сеть, а <code>L 192.168.10.1/32<\/code> — адрес самого маршрутизатора. Источник: с. 40–43, 53.<\/p>", "en": "<p>A <strong>connected<\/strong> network is added automatically when its addressed interface is active. An administrator configures a <strong>static<\/strong> route. <strong>Dynamic<\/strong> routes are learned through routing protocols and updated after topology changes. A <strong>default route<\/strong> is used when no suitable more-specific route matches.<\/p><p>In <code>show ip route<\/code>: <code>C<\/code> means connected network; <code>L<\/code> means the router’s own interface address; <code>S<\/code> means static; <code>O<\/code> means OSPF; <code>D<\/code> means EIGRP. For example, <code>C 192.168.10.0/24<\/code> describes a network, while <code>L 192.168.10.1/32<\/code> describes the router itself. Source: pp. 40–43, 53.<\/p>"}}, {"heading": {"ru": "Команды, которые надо узнавать", "en": "Commands to recognize"}, "html": {"ru": "<pre><code>interface gigabitEthernet 0/0/0\nip address 192.168.10.1 255.255.255.0\nno shutdown\nend\ncopy running-config startup-config<\/code><\/pre><p><code>ip address<\/code> задаёт адрес и маску интерфейса; <code>no shutdown<\/code> включает его административно. Это не гарантирует исправность физического подключения. <code>copy running-config startup-config<\/code> сохраняет текущую конфигурацию для следующей загрузки.<\/p><p><code>show ip interface brief<\/code> быстро показывает адреса и состояние интерфейсов; <code>show ip route<\/code> — маршруты; <code>show interfaces<\/code> — подробную статистику. <code>enable secret<\/code> защищает privileged EXEC. На L2-коммутаторе <code>ip default-gateway<\/code> нужен для управления из другой сети. Источник: с. 45–58.<\/p>", "en": "<pre><code>interface gigabitEthernet 0/0/0\nip address 192.168.10.1 255.255.255.0\nno shutdown\nend\ncopy running-config startup-config<\/code><\/pre><p><code>ip address<\/code> assigns the interface address and mask; <code>no shutdown<\/code> administratively enables it. This does not guarantee a working physical link. <code>copy running-config startup-config<\/code> saves the current configuration for the next boot.<\/p><p><code>show ip interface brief<\/code> quickly displays addresses and interface status; <code>show ip route<\/code> displays routes; <code>show interfaces<\/code> gives detailed statistics. <code>enable secret<\/code> protects privileged EXEC access. A Layer 2 switch uses <code>ip default-gateway<\/code> for management from another network. Source: pp. 45–58.<\/p>"}}], "traps": [{"ru": "Удалённый сервер: IP сервера, но MAC шлюза на первом Ethernet-переходе.", "en": "Remote server: server IP, but gateway MAC on the first Ethernet hop."}, {"ru": "ARP — IPv4; ND/ICMPv6 — IPv6. NS/NA не путать с RS/RA.", "en": "ARP is for IPv4; ND/ICMPv6 is for IPv6. Do not confuse NS/NA with RS/RA."}, {"ru": "IPv6: маршрутизаторы не фрагментируют; базовый заголовок — 40 байт.", "en": "IPv6 routers do not fragment; the base header is 40 bytes."}, {"ru": "no shutdown включает интерфейс, а copy running-config startup-config сохраняет конфигурацию.", "en": "no shutdown enables an interface; copy running-config startup-config saves the configuration."}]}, {"id": "l6", "lecture": 6, "title": {"ru": "IPv4 и расчёт подсетей", "en": "IPv4 and subnet calculations"}, "summary": {"ru": "Маски, диапазоны адресов, число хостов и VLSM: правила, которые помогают решать тесты без угадывания.", "en": "Masks, address ranges, host counts and VLSM: rules that let you solve questions instead of guessing."}, "sourcePages": "1–62", "sections": [{"heading": {"ru": "Адрес, маска и префикс", "en": "Address, mask and prefix"}, "html": {"ru": "<p>IPv4 состоит из <strong>32 бит<\/strong>: сетевой и хостовой частей. Маска определяет границу. В обычной маске единицы идут подряд слева, затем нули; <code>/n<\/code> означает число сетевых битов. Например, <code>/24 = 255.255.255.0<\/code>, <code>/26 = 255.255.255.192<\/code>.<\/p><p>Чтобы получить адрес сети, выполни побитовое <strong>IP AND mask<\/strong>. Только <code>1 AND 1<\/code> даёт 1; остальные сочетания дают 0. Не определяй сеть только по первым трём десятичным числам: это работает лишь при подходящей маске, например /24. Источник: с. 5–9.<\/p>", "en": "<p>IPv4 contains <strong>32 bits<\/strong>, divided into network and host portions. The mask defines the boundary. An ordinary mask has consecutive ones followed by zeros; <code>/n<\/code> counts the network bits. For example, <code>/24 = 255.255.255.0<\/code> and <code>/26 = 255.255.255.192<\/code>.<\/p><p>Find the network address with a bitwise <strong>IP AND mask<\/strong>. Only <code>1 AND 1<\/code> produces 1; every other pair produces 0. Do not identify a network merely from the first three decimal numbers: that only works with an appropriate mask, such as /24. Source: pp. 5–9.<\/p>"}}, {"heading": {"ru": "Сеть, хосты и broadcast", "en": "Network, hosts and broadcast"}, "html": {"ru": "<p>У <strong>адреса сети<\/strong> все хостовые биты равны 0. У <strong>broadcast-адреса<\/strong> все хостовые биты равны 1. Для обычных подсетей из лекции usable hosts находятся между ними: первый = network + 1, последний = broadcast − 1.<\/p><p>Для <code>192.168.10.0/24<\/code>: сеть — <code>.0<\/code>, хосты — <code>.1–.254<\/code>, broadcast — <code>.255<\/code>. Если осталось h хостовых битов, всего адресов <code>2^h<\/code>, обычных доступных адресов хостов <code>2^h − 2<\/code>. Эти учебные расчёты относятся к обычным подсетям, включая /24–/30. Источник: с. 27, 47–49.<\/p>", "en": "<p>A <strong>network address<\/strong> has all host bits set to 0. A <strong>broadcast address<\/strong> has all host bits set to 1. For the ordinary subnets used in this lecture, usable hosts lie between them: first = network + 1, last = broadcast − 1.<\/p><p>For <code>192.168.10.0/24<\/code>, the network is <code>.0<\/code>, hosts are <code>.1–.254<\/code> and broadcast is <code>.255<\/code>. With h host bits, there are <code>2^h<\/code> total addresses and <code>2^h − 2<\/code> ordinary usable host addresses. These calculations apply to ordinary subnets, including /24–/30. Source: pp. 27, 47–49.<\/p>"}}, {"heading": {"ru": "Таблица масок для теста", "en": "Subnet mask quick table"}, "html": {"ru": "<table><thead><tr><th>Префикс<\/th><th>Маска<\/th><th>Шаг<\/th><th>Хостов<\/th><\/tr><\/thead><tbody><tr><td>/24<\/td><td>255.255.255.0<\/td><td>256<\/td><td>254<\/td><\/tr><tr><td>/25<\/td><td>255.255.255.128<\/td><td>128<\/td><td>126<\/td><\/tr><tr><td>/26<\/td><td>255.255.255.192<\/td><td>64<\/td><td>62<\/td><\/tr><tr><td>/27<\/td><td>255.255.255.224<\/td><td>32<\/td><td>30<\/td><\/tr><tr><td>/28<\/td><td>255.255.255.240<\/td><td>16<\/td><td>14<\/td><\/tr><tr><td>/29<\/td><td>255.255.255.248<\/td><td>8<\/td><td>6<\/td><\/tr><tr><td>/30<\/td><td>255.255.255.252<\/td><td>4<\/td><td>2<\/td><\/tr><\/tbody><\/table><p>Шаг в последнем октете = 256 − последний октет маски. Если исходную /24 делят на /27, заимствованы 3 бита: <code>2^3 = 8<\/code> подсетей по 30 usable hosts. Более длинный префикс означает меньше хостов в каждой подсети. Источник: с. 47–49, 52.<\/p>", "en": "<table><thead><tr><th>Prefix<\/th><th>Mask<\/th><th>Block size<\/th><th>Hosts<\/th><\/tr><\/thead><tbody><tr><td>/24<\/td><td>255.255.255.0<\/td><td>256<\/td><td>254<\/td><\/tr><tr><td>/25<\/td><td>255.255.255.128<\/td><td>128<\/td><td>126<\/td><\/tr><tr><td>/26<\/td><td>255.255.255.192<\/td><td>64<\/td><td>62<\/td><\/tr><tr><td>/27<\/td><td>255.255.255.224<\/td><td>32<\/td><td>30<\/td><\/tr><tr><td>/28<\/td><td>255.255.255.240<\/td><td>16<\/td><td>14<\/td><\/tr><tr><td>/29<\/td><td>255.255.255.248<\/td><td>8<\/td><td>6<\/td><\/tr><tr><td>/30<\/td><td>255.255.255.252<\/td><td>4<\/td><td>2<\/td><\/tr><\/tbody><\/table><p>For these masks, last-octet block size = 256 − the last mask octet. Splitting an original /24 into /27 borrows 3 bits: <code>2^3 = 8<\/code> subnets with 30 usable hosts each. A longer prefix means fewer hosts in each subnet. Source: pp. 47–49, 52.<\/p>"}}, {"heading": {"ru": "Пример: 192.168.10.77/26", "en": "Worked example: 192.168.10.77/26"}, "html": {"ru": "<ol><li>Маска /26 — <code>255.255.255.192<\/code>.<\/li><li>Шаг: <code>256 − 192 = 64<\/code>.<\/li><li>Границы блоков: <code>0, 64, 128, 192<\/code>.<\/li><li>77 попадает в блок <code>64–127<\/code>.<\/li><li>Сеть: <code>192.168.10.64<\/code>; broadcast: <code>192.168.10.127<\/code>.<\/li><li>Хосты: <code>192.168.10.65–192.168.10.126<\/code>; их <code>2^6 − 2 = 62<\/code>.<\/li><\/ol><p>Для выбора самой маленькой подходящей подсети найди минимальное h, при котором <code>2^h − 2<\/code> покрывает нужное число хостов. Для 40 хостов /27 мало, /26 подходит. Пример рассчитан по правилам с. 8–9, 27, 49, 52.<\/p>", "en": "<ol><li>The /26 mask is <code>255.255.255.192<\/code>.<\/li><li>Block size: <code>256 − 192 = 64<\/code>.<\/li><li>Block boundaries: <code>0, 64, 128, 192<\/code>.<\/li><li>77 lies within <code>64–127<\/code>.<\/li><li>Network: <code>192.168.10.64<\/code>; broadcast: <code>192.168.10.127<\/code>.<\/li><li>Hosts: <code>192.168.10.65–192.168.10.126<\/code>; count: <code>2^6 − 2 = 62<\/code>.<\/li><\/ol><p>To choose the smallest suitable subnet, find the smallest h for which <code>2^h − 2<\/code> covers the required hosts. For 40 hosts, /27 is too small and /26 works. This example applies the rules on pp. 8–9, 27, 49, 52.<\/p>"}}, {"heading": {"ru": "Частные и специальные диапазоны", "en": "Private and special address ranges"}, "html": {"ru": "<table><thead><tr><th>Блок<\/th><th>Назначение<\/th><\/tr><\/thead><tbody><tr><td>10.0.0.0/8<\/td><td>Частный: 10.0.0.0–10.255.255.255<\/td><\/tr><tr><td>172.16.0.0/12<\/td><td>Частный: 172.16.0.0–172.31.255.255<\/td><\/tr><tr><td>192.168.0.0/16<\/td><td>Частный: 192.168.0.0–192.168.255.255<\/td><\/tr><tr><td>127.0.0.0/8<\/td><td>Loopback; обычно 127.0.0.1<\/td><\/tr><tr><td>169.254.0.0/16<\/td><td>Link-local / APIPA<\/td><\/tr><tr><td>224.0.0.0/4<\/td><td>Multicast: 224.0.0.0–239.255.255.255<\/td><\/tr><\/tbody><\/table><p>Частные адреса не маршрутизируются глобально. NAT обычно переводит внутренние адреса для доступа в интернет. Не весь диапазон 172.x является частным. APIPA на Windows часто указывает, что клиент не получил ответ DHCP. Источник: с. 31, 36–38.<\/p>", "en": "<table><thead><tr><th>Block<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>10.0.0.0/8<\/td><td>Private: 10.0.0.0–10.255.255.255<\/td><\/tr><tr><td>172.16.0.0/12<\/td><td>Private: 172.16.0.0–172.31.255.255<\/td><\/tr><tr><td>192.168.0.0/16<\/td><td>Private: 192.168.0.0–192.168.255.255<\/td><\/tr><tr><td>127.0.0.0/8<\/td><td>Loopback; commonly 127.0.0.1<\/td><\/tr><tr><td>169.254.0.0/16<\/td><td>Link-local / APIPA<\/td><\/tr><tr><td>224.0.0.0/4<\/td><td>Multicast: 224.0.0.0–239.255.255.255<\/td><\/tr><\/tbody><\/table><p>Private addresses are not globally routed. NAT commonly translates internal addresses for internet access. Not every 172.x address is private. APIPA on Windows often indicates that the client received no DHCP response. Source: pp. 31, 36–38.<\/p>"}}, {"heading": {"ru": "Зачем разделять сеть", "en": "Why divide a network?"}, "html": {"ru": "<p><strong>Unicast<\/strong> отправляет пакет одному адресату, <strong>broadcast<\/strong> — всем в локальном broadcast-домене, <strong>multicast<\/strong> — группе. Коммутатор распространяет broadcast внутри своего домена; маршрутизатор отделяет его от других сетей. Большое число broadcasts расходует пропускную способность и ресурсы устройств.<\/p><p>Subnetting уменьшает размер broadcast-доменов, ограничивает влияние сбоев и упрощает политики между сетями. Разделять можно по местоположению, подразделению или типу устройств. Планирование учитывает число подсетей, хостов, шлюзы, DHCP-пулы и адреса управления. Источник: с. 29–31, 43–45, 60–61.<\/p>", "en": "<p><strong>Unicast<\/strong> sends to one recipient, <strong>broadcast<\/strong> to everyone in the local broadcast domain, and <strong>multicast<\/strong> to a group. A switch propagates broadcasts within its domain; a router separates it from other networks. Excessive broadcasts consume bandwidth and device resources.<\/p><p>Subnetting reduces broadcast-domain size, limits the effects of abnormal traffic and helps enforce policies between networks. Subnets may follow location, department or device type. Planning considers subnet counts, hosts, gateways, DHCP pools and management addresses. Source: pp. 29–31, 43–45, 60–61.<\/p>"}}, {"heading": {"ru": "VLSM: сначала самая большая сеть", "en": "VLSM: allocate the largest first"}, "html": {"ru": "<p><s
